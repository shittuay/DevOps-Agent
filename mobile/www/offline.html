<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevOps Agent</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a0a0a; color: #e6edf3; font: 17px/1.5 -apple-system, system-ui, sans-serif;
         padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #9da7b3; margin: 0 0 24px; }
  button { background: #ff6b35; color: #fff; border: 0; border-radius: 10px; padding: 12px 28px;
           font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <h1>Can't reach DevOps Agent</h1>
    <p>Check your internet connection and try again. Nothing in your cloud accounts has changed.</p>
    <button type="button" onclick="window.location.replace('https://devopsagent.io/chat')">Try again</button>
  </main>
</body>
</html>
