{% extends "base.html" %}
{% block title %}API Keys - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>API Keys</h1>
        <a href="{{ url_for('api_gateway.create_key') }}" class="btn btn-primary">Create New Key</a>
    </div>
    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead>
                    <tr><th>Name</th><th>Key Prefix</th><th>Scopes</th><th>Created</th><th>Last Used</th><th>Actions</th></tr>
                </thead>
                <tbody id="keysTable">
                    <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<style>
.container { padding: 20px; max-width: 1200px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
.card-body { padding: 20px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
</style>
<script>
document.addEventListener('DOMContentLoaded', loadKeys);
async function loadKeys() {
    const response = await fetch('/api-gateway/api/keys');
    if (response.ok) {
        const data = await response.json();
        renderKeys(data.keys || []);
    }
}
function renderKeys(keys) {
    const tbody = document.getElementById('keysTable');
    if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No API keys</td></tr>';
        return;
    }
    tbody.innerHTML = keys.map(k => `
        <tr>
            <td>${k.name}</td>
            <td><code>${k.key_prefix}****</code></td>
            <td>${(k.scopes || []).join(', ')}</td>
            <td>${new Date(k.created_at).toLocaleDateString()}</td>
            <td>${k.last_used_at ? new Date(k.last_used_at).toLocaleDateString() : 'Never'}</td>
            <td><button class="btn btn-sm btn-danger" onclick="revokeKey(${k.id})">Revoke</button></td>
        </tr>
    `).join('');
}
async function revokeKey(id) {
    if (!confirm('Revoke this key?')) return;
    await fetch('/api-gateway/keys/' + id + '/revoke', {method: 'POST'});
    loadKeys();
}
</script>
{% endblock %}
