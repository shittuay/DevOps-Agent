{% extends "base.html" %}
{% block title %}Create API Key - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Create API Key</h1>
        <a href="{{ url_for('api_gateway.list_keys') }}" class="btn btn-secondary">Back</a>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>Key Name:</label>
                    <input type="text" name="name" class="form-control" required placeholder="My API Key">
                </div>
                <div class="form-group">
                    <label>Scopes:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="scopes" value="read" checked> Read</label>
                        <label><input type="checkbox" name="scopes" value="write"> Write</label>
                        <label><input type="checkbox" name="scopes" value="admin"> Admin</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Expires (optional):</label>
                    <input type="date" name="expires_at" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Create Key</button>
            </form>
        </div>
    </div>
    {% if new_key %}
    <div class="card mt-4 alert-success">
        <div class="card-body">
            <h4>API Key Created!</h4>
            <p>Copy this key now. You won't be able to see it again:</p>
            <code class="key-display">{{ new_key }}</code>
            <button class="btn btn-sm btn-secondary" onclick="navigator.clipboard.writeText('{{ new_key }}')">Copy</button>
        </div>
    </div>
    {% endif %}
</div>
<style>
.container { padding: 20px; max-width: 600px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
.card-body { padding: 20px; }
.form-group { margin-bottom: 15px; }
.form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; }
.checkbox-group { display: flex; gap: 20px; }
.checkbox-group label { display: flex; align-items: center; gap: 5px; }
.key-display { display: block; padding: 15px; background: #1e1e1e; color: #d4d4d4; border-radius: 4px; margin: 10px 0; word-break: break-all; }
.alert-success { border-color: #28a745; background: rgba(40, 167, 69, 0.1); }
</style>
{% endblock %}
