{% extends "base.html" %}
{% block title %}Cost Analytics - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Cost Analytics</h1>
        <a href="{{ url_for('analytics.dashboard') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="analytics-nav">
        <a href="{{ url_for('analytics.dashboard') }}" class="nav-item">Dashboard</a>
        <a href="{{ url_for('analytics.cost_analytics') }}" class="nav-item active">Costs</a>
        <a href="{{ url_for('analytics.resource_analytics') }}" class="nav-item">Resources</a>
    </div>
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-icon"><i class="fas fa-dollar-sign"></i></div>
            <div class="metric-content">
                <span class="metric-label">Monthly Spend</span>
                <span class="metric-value" id="monthlySpend">--</span>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon"><i class="fas fa-chart-line"></i></div>
            <div class="metric-content">
                <span class="metric-label">Forecast (30d)</span>
                <span class="metric-value" id="forecast">--</span>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon"><i class="fas fa-piggy-bank"></i></div>
            <div class="metric-content">
                <span class="metric-label">Savings Found</span>
                <span class="metric-value" id="savings">--</span>
            </div>
        </div>
    </div>
    <div class="card">
        <h3>Cost Breakdown by Service</h3>
        <div style="height: 300px; position: relative;">
            <canvas id="costChart"></canvas>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    Promise.all([
        fetch('/analytics/api/costs/summary').then(r => r.json()),
        fetch('/analytics/api/costs/forecast').then(r => r.json())
    ]).then(([summary, forecast]) => {
        document.getElementById('monthlySpend').textContent = '$' + (summary.total || 0).toFixed(2);
        document.getElementById('forecast').textContent = '$' + (forecast.monthly_projection || 0).toFixed(2);
        document.getElementById('savings').textContent = '$0.00';

        const byService = summary.by_service || {};
        const labels = Object.keys(byService);
        const values = Object.values(byService);
        if (labels.length) {
            const ctx = document.getElementById('costChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#667eea', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#06b6d4']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }
    }).catch(console.error);
});
</script>
{% endblock %}
