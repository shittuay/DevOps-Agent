{% extends "base.html" %}
{% block title %}Resource Analytics - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Resource Analytics</h1>
        <a href="{{ url_for('analytics.dashboard') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="analytics-nav">
        <a href="{{ url_for('analytics.dashboard') }}" class="nav-item">Dashboard</a>
        <a href="{{ url_for('analytics.cost_analytics') }}" class="nav-item">Costs</a>
        <a href="{{ url_for('analytics.resource_analytics') }}" class="nav-item active">Resources</a>
    </div>
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-icon"><i class="fas fa-server"></i></div>
            <div class="metric-content">
                <span class="metric-label">Total Resources</span>
                <span class="metric-value" id="totalResources">--</span>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon"><i class="fas fa-microchip"></i></div>
            <div class="metric-content">
                <span class="metric-label">Avg CPU Usage</span>
                <span class="metric-value" id="avgCpu">--</span>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon"><i class="fas fa-memory"></i></div>
            <div class="metric-content">
                <span class="metric-label">Avg Memory Usage</span>
                <span class="metric-value" id="avgMemory">--</span>
            </div>
        </div>
    </div>
    <div class="card">
        <h3>Resource Utilization by Type</h3>
        <div style="height: 300px; position: relative;">
            <canvas id="resourceChart"></canvas>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/analytics/api/resources/utilization')
        .then(r => r.json())
        .then(data => {
            document.getElementById('totalResources').textContent = data.total_resources || 0;
            document.getElementById('avgCpu').textContent = (data.utilization_avg || 0).toFixed(1) + '%';
            const byType = data.by_type || {};
            const total = data.total_resources || 1;
            const rdsCount = byType.rds || 0;
            document.getElementById('avgMemory').textContent = ((rdsCount / total) * 100).toFixed(1) + '%';

            const labels = Object.keys(byType).map(k => k.toUpperCase());
            const values = Object.values(byType);
            if (labels.length) {
                const ctx = document.getElementById('resourceChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Count',
                            data: values,
                            backgroundColor: ['#667eea', '#10b981', '#f59e0b']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }).catch(console.error);
});
</script>
{% endblock %}
