<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DevOps Agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-pages.css') }}">

    <style>
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand-logo">
                <div class="brand-icon">D</div>
                <div class="brand-name">DevOps Agent</div>
            </div>

            <div class="header">
                <h1>Forgot Password</h1>
                <p>Enter the email address associated with your account and we'll send you a link to reset your password.</p>
            </div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            {% if not success %}
            <form method="POST" action="/forgot-password" id="forgotForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autofocus
                    />
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    Send Reset Link
                </button>
            </form>
            {% endif %}

            <div class="back-link">
                <a href="/login">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        var form = document.getElementById('forgotForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                var btn = document.getElementById('submitBtn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Sending...';
            });
        }
    </script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
