{% extends "base.html" %}
{% block title %}Deployments - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Deployment History</h1>
        <a href="{{ url_for('ai_infrastructure.dashboard') }}" class="btn btn-secondary">Back</a>
    </div>
    <table class="table">
        <thead>
            <tr><th>ID</th><th>Description</th><th>Provider</th><th>Status</th><th>Cost</th><th>Created</th><th>Actions</th></tr>
        </thead>
        <tbody id="deploymentsTable">
            <tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>
        </tbody>
    </table>
</div>
<style>
.container { padding: 20px; max-width: 1400px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.table { width: 100%; border-collapse: collapse; background: var(--card-bg); }
.table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
.status-completed { color: #28a745; }
.status-failed { color: #dc3545; }
.status-pending { color: #ffc107; }
</style>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    try {
        const response = await fetch('/ai/api/deployments');
        if (response.ok) {
            const data = await response.json();
            renderDeployments(data.deployments || []);
        }
    } catch (error) {
        document.getElementById('deploymentsTable').innerHTML = '<tr><td colspan="7">Error loading</td></tr>';
    }
});

function renderDeployments(deployments) {
    const tbody = document.getElementById('deploymentsTable');
    if (deployments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No deployments yet</td></tr>';
        return;
    }
    tbody.innerHTML = deployments.map(d => `
        <tr>
            <td>${d.request_id}</td>
            <td>${d.description || d.natural_language_input?.substring(0, 50) || '-'}</td>
            <td>${d.cloud_provider}</td>
            <td class="status-${d.status}">${d.status}</td>
            <td>$${d.estimated_monthly_cost || 0}</td>
            <td>${new Date(d.created_at).toLocaleDateString()}</td>
            <td><button class="btn btn-sm btn-secondary">View</button></td>
        </tr>
    `).join('');
}
</script>
{% endblock %}
