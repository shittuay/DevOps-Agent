{% extends "base.html" %}
{% block title %}AI Recommendations - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>AI Recommendations</h1>
        <a href="{{ url_for('ai_infrastructure.dashboard') }}" class="btn btn-secondary">Back</a>
    </div>
    <div id="recommendationsList"><p class="text-muted">Loading recommendations...</p></div>
</div>
<style>
.container { padding: 20px; max-width: 1200px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.recommendation-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
.recommendation-card h4 { margin: 0 0 10px 0; }
.savings-badge { background: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
</style>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    try {
        const response = await fetch('/ai/api/recommendations');
        if (response.ok) {
            const data = await response.json();
            renderRecommendations(data.recommendations || []);
        }
    } catch (error) {
        document.getElementById('recommendationsList').innerHTML = '<p>Error loading recommendations</p>';
    }
});

function renderRecommendations(recs) {
    const container = document.getElementById('recommendationsList');
    if (recs.length === 0) {
        container.innerHTML = '<p class="text-muted">No recommendations available</p>';
        return;
    }
    container.innerHTML = recs.map(r => `
        <div class="recommendation-card">
            <h4>${r.title} ${r.potential_savings ? `<span class="savings-badge">Save $${r.potential_savings}/mo</span>` : ''}</h4>
            <p>${r.description}</p>
            <p><strong>Priority:</strong> ${r.priority || 'Medium'}</p>
            <button class="btn btn-primary" onclick="applyRecommendation('${r.id}')">Apply</button>
        </div>
    `).join('');
}
</script>
{% endblock %}
