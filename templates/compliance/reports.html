{% extends "base.html" %}
{% block title %}Compliance Reports - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Compliance Reports</h1>
        <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
    </div>
    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead><tr><th>Report Name</th><th>Framework</th><th>Score</th><th>Generated</th><th>Format</th><th>Actions</th></tr></thead>
                <tbody id="reportsTable"><tr><td colspan="6" class="text-center">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div id="generateModal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Generate Compliance Report</h3>
        <form id="generateForm">
            <div class="form-group">
                <label>Report Name:</label>
                <input type="text" name="name" class="form-control" required placeholder="Q1 2024 SOC 2 Report">
            </div>
            <div class="form-group">
                <label>Framework:</label>
                <select name="framework" class="form-control">
                    <option value="soc2">SOC 2</option>
                    <option value="hipaa">HIPAA</option>
                    <option value="pci_dss">PCI-DSS</option>
                    <option value="gdpr">GDPR</option>
                </select>
            </div>
            <div class="form-group">
                <label>Format:</label>
                <select name="format" class="form-control">
                    <option value="pdf">PDF</option>
                    <option value="csv">CSV</option>
                    <option value="json">JSON</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Generate</button>
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </form>
    </div>
</div>
<style>
.container { padding: 20px; max-width: 1200px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
.card-body { padding: 20px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
.modal-content { background: var(--card-bg); padding: 30px; border-radius: 8px; width: 400px; }
.form-group { margin-bottom: 15px; }
.form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; }
</style>
<script>
document.addEventListener('DOMContentLoaded', loadReports);
async function loadReports() {
    const response = await fetch('/compliance/api/reports');
    if (response.ok) {
        const data = await response.json();
        renderReports(data.reports || []);
    }
}
function renderReports(reports) {
    const tbody = document.getElementById('reportsTable');
    if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No reports generated yet</td></tr>';
        return;
    }
    tbody.innerHTML = reports.map(r => `
        <tr>
            <td>${r.name}</td>
            <td>${r.framework}</td>
            <td>${r.overall_score || 0}%</td>
            <td>${new Date(r.generated_at).toLocaleDateString()}</td>
            <td>${r.file_format || 'pdf'}</td>
            <td><a href="/compliance/reports/${r.id}/download" class="btn btn-sm btn-primary">Download</a></td>
        </tr>
    `).join('');
}
function generateReport() {
    document.getElementById('generateModal').style.display = 'flex';
}
function closeModal() {
    document.getElementById('generateModal').style.display = 'none';
}
document.getElementById('generateForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    await fetch('/compliance/reports/generate', {
        method: 'POST',
        body: formData
    });
    closeModal();
    loadReports();
});
</script>
{% endblock %}
