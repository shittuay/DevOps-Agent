{% extends "base.html" %}
{% block title %}Security Policies - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Security Policies</h1>
        <a href="{{ url_for('compliance.create_policy') }}" class="btn btn-primary">Create Policy</a>
    </div>
    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead><tr><th>Name</th><th>Type</th><th>Enforcement</th><th>Violations</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="policiesTable"><tr><td colspan="6" class="text-center">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<style>
.container { padding: 20px; max-width: 1200px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
.card-body { padding: 20px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.badge-success { background: #28a745; color: white; }
.badge-secondary { background: #6c757d; color: white; }
.badge-danger { background: #dc3545; color: white; }
</style>
<script>
document.addEventListener('DOMContentLoaded', loadPolicies);
async function loadPolicies() {
    const response = await fetch('/compliance/api/policies');
    if (response.ok) {
        const data = await response.json();
        renderPolicies(data.policies || []);
    }
}
function renderPolicies(policies) {
    const tbody = document.getElementById('policiesTable');
    if (policies.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No policies defined</td></tr>';
        return;
    }
    tbody.innerHTML = policies.map(p => `
        <tr>
            <td>${p.name}</td>
            <td>${p.policy_type || '-'}</td>
            <td>${p.enforcement_action || 'alert'}</td>
            <td>${p.violations_count || 0}</td>
            <td><span class="badge badge-${p.is_active ? 'success' : 'secondary'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>
                <button class="btn btn-sm btn-secondary" onclick="togglePolicy(${p.id})">Toggle</button>
            </td>
        </tr>
    `).join('');
}
async function togglePolicy(id) {
    await fetch('/compliance/policies/' + id + '/toggle', {method: 'POST'});
    loadPolicies();
}
</script>
{% endblock %}
