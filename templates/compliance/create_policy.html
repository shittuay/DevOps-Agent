{% extends "base.html" %}
{% block title %}Create Policy - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Create Security Policy</h1>
        <a href="{{ url_for('compliance.policies') }}" class="btn btn-secondary">Back</a>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>Policy Name:</label>
                    <input type="text" name="name" class="form-control" required placeholder="No Public S3 Buckets">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Describe what this policy enforces..."></textarea>
                </div>
                <div class="form-group">
                    <label>Policy Type:</label>
                    <select name="policy_type" class="form-control">
                        <option value="security">Security</option>
                        <option value="access">Access Control</option>
                        <option value="data">Data Protection</option>
                        <option value="network">Network</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Enforcement Action:</label>
                    <select name="enforcement_action" class="form-control">
                        <option value="alert">Alert Only</option>
                        <option value="block">Block</option>
                        <option value="auto_remediate">Auto Remediate</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Policy</button>
            </form>
        </div>
    </div>
</div>
<style>
.container { padding: 20px; max-width: 600px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
.card-body { padding: 20px; }
.form-group { margin-bottom: 15px; }
.form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; }
</style>
{% endblock %}
