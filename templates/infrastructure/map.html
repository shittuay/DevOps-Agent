<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Map — DevOps Agent</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
    height: 100%;
    font-family: 'Outfit', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
}

/* ── Top bar ───────────────────────────────────────────────────────────── */
#topbar {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
    position: relative;
    z-index: 50;
}
.tb-left  { display:flex; align-items:center; gap:12px; }
.tb-right { display:flex; align-items:center; gap:6px; }
#topbar h1 { font-size:16px; font-weight:700; }

a.back-btn, button.tb-btn {
    display:inline-flex; align-items:center; gap:5px;
    padding:6px 13px; border-radius:7px;
    border:1px solid var(--border-subtle);
    background:var(--bg-elevated);
    color:var(--text-secondary);
    font-size:13px; font-weight:500;
    text-decoration:none; cursor:pointer;
    transition:all .14s;
}
a.back-btn:hover, button.tb-btn:hover {
    border-color:var(--accent-primary);
    color:var(--accent-primary);
}
button.tb-btn.primary {
    background:var(--accent-primary);
    border-color:var(--accent-primary);
    color:#fff;
}
button.tb-btn.primary:hover { filter:brightness(1.1); }

/* ── Filter bar ─────────────────────────────────────────────────────────── */
#filterBar {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
    position: relative;
    z-index: 50;
    overflow-x: auto;
}
.fc {
    padding:4px 12px; border-radius:20px; border:1px solid var(--border-subtle);
    background:var(--bg-elevated); color:var(--text-secondary); font-size:12px;
    cursor:pointer; transition:all .14s; white-space:nowrap;
}
.fc.on { border-color:#6366f1; color:#6366f1; background:rgba(99,102,241,.12); }
.fc-label { font-size:12px; color:var(--text-secondary); white-space:nowrap; }

/* ── Viewport + world ───────────────────────────────────────────────────── */
#viewport {
    position: relative;
    overflow: hidden;
    /* fills remaining height */
    height: calc(100vh - 52px - 40px);
    background: var(--bg-primary);
    cursor: grab;
}
#viewport:active { cursor:grabbing; }

/* subtle dot grid */
#viewport::before {
    content:'';
    position:absolute; inset:0; pointer-events:none;
    background-image: radial-gradient(circle, var(--border-subtle) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    opacity:.6;
}

#world {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    /* width/height set by JS */
}

/* ── SVG edges ──────────────────────────────────────────────────────────── */
#edgeSvg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
}

/* ── Node cards ─────────────────────────────────────────────────────────── */
.nd {
    position: absolute;
    width: 172px;
    background: var(--bg-secondary);
    border: 1.5px solid var(--border-subtle);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    user-select: none;
}
.nd:hover {
    border-color: #6366f1;
    box-shadow: 0 4px 20px rgba(99,102,241,.28);
    z-index: 20 !important;
}
.nd.grp {
    width: 188px;
    border-color: #6366f1;
    background: rgba(99,102,241,.07);
}
.nd-head { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.nd-ico {
    width:30px; height:30px; border-radius:7px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
}
.nd-name {
    font-size:13px; font-weight:600; color:var(--text-primary);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:116px;
}
.nd-sub {
    font-size:10px; color:var(--text-secondary);
    font-family:'IBM Plex Mono',monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    margin-bottom:5px;
}
.nd-foot { display:flex; align-items:center; justify-content:space-between; }
.nd-st {
    display:inline-flex; align-items:center; gap:4px;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
}
.nd-st::before {
    content:''; width:6px; height:6px; border-radius:50%; display:inline-block;
}
.nd-st.running::before,.nd-st.active::before,
.nd-st.attached::before,.nd-st.healthy::before  { background:#22c55e; }
.nd-st.running,.nd-st.active,
.nd-st.attached,.nd-st.healthy  { color:#22c55e; }
.nd-st.stopped::before  { background:#6b7280; }
.nd-st.stopped          { color:#6b7280; }
.nd-st.error::before,.nd-st.failed::before      { background:#ef4444; }
.nd-st.error,.nd-st.failed      { color:#ef4444; }
.nd-st.pending::before,.nd-st.available::before { background:#f59e0b; }
.nd-st.pending,.nd-st.available { color:#f59e0b; }
.nd-cost { font-size:10px; color:var(--text-secondary); }

/* icon bg */
.i-ec2          { background:rgba(255,153,0,.15); }
.i-rds          { background:rgba(52,168,83,.15); }
.i-s3           { background:rgba(66,133,244,.15); }
.i-lambda       { background:rgba(234,67,53,.15); }
.i-ebs          { background:rgba(103,58,183,.15); }
.i-elastic_ip   { background:rgba(33,150,243,.15); }
.i-vpc          { background:rgba(99,102,241,.15); }
.i-cluster      { background:rgba(14,165,233,.15); }
.i-lb,.i-loadbalancer { background:rgba(245,158,11,.15); }
.i-default      { background:rgba(107,114,128,.15); }

/* ── Overlay UI ─────────────────────────────────────────────────────────── */
#statsBar {
    position:absolute; top:10px; right:16px; z-index:30;
    display:flex; gap:6px;
}
.pill {
    background:var(--bg-secondary); border:1px solid var(--border-subtle);
    border-radius:20px; padding:4px 11px; font-size:12px; color:var(--text-secondary);
}
.pill strong { color:var(--text-primary); }

#legend {
    position:absolute; bottom:14px; left:14px; z-index:30;
    background:var(--bg-secondary); border:1px solid var(--border-subtle);
    border-radius:10px; padding:9px 13px; font-size:11px;
}
.leg-h { font-weight:700; color:var(--text-secondary); text-transform:uppercase;
         letter-spacing:.07em; margin-bottom:5px; font-size:10px; }
.leg-r { display:flex; align-items:center; gap:6px; color:var(--text-secondary); margin-bottom:3px; }
.leg-d { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

#tooltip {
    position:fixed; background:var(--bg-elevated); border:1px solid var(--border-subtle);
    border-radius:10px; padding:10px 14px; font-size:12px; color:var(--text-primary);
    z-index:200; pointer-events:auto; max-width:240px; box-shadow:0 8px 28px rgba(0,0,0,.35);
    display:none; line-height:1.6;
}
.tip-investigate {
    display:inline-block; margin-top:8px; padding:4px 10px;
    background:var(--accent-primary,#6366f1); color:#fff;
    border-radius:6px; font-size:11px; font-weight:600;
    text-decoration:none; transition:filter .14s;
}
.tip-investigate:hover { filter:brightness(1.12); }
.tip-k { color:var(--text-secondary); }
.tip-v { color:var(--text-primary); font-weight:600; }

#emptyState {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:10;
    pointer-events:none;
}
#emptyState.hidden { display:none; }
#emptyState .es-icon { font-size:52px; opacity:.4; }
#emptyState p { font-size:15px; color:var(--text-secondary); }
#emptyState a {
    padding:9px 20px; background:var(--accent-primary); color:#fff;
    border-radius:8px; text-decoration:none; font-size:13px; font-weight:600;
    pointer-events:all;
}

/* edge label */
.elabel { font-size:10px; fill:var(--text-secondary); font-family:'IBM Plex Mono',monospace; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
    <div class="tb-left">
        <a class="back-btn" href="/dashboard">← Dashboard</a>
        <h1>Infrastructure Map</h1>
    </div>
    <div class="tb-right">
        <button class="tb-btn" onclick="fitView()">⊡ Fit</button>
        <button class="tb-btn" onclick="zoom(1.25)">＋</button>
        <button class="tb-btn" onclick="zoom(0.8)">－</button>
        <button class="tb-btn primary" onclick="loadMap()">↻ Refresh</button>
    </div>
</div>

<!-- Filter chips -->
<div id="filterBar">
    <span class="fc-label">Filter:</span>
    <button class="fc on" data-p="all" onclick="setFilter(this,'all')">All</button>
</div>

<!-- Map viewport -->
<div id="viewport">
    <div id="world">
        <svg id="edgeSvg"></svg>
    </div>
    <div id="statsBar" style="display:none">
        <div class="pill">Nodes: <strong id="sNodes">0</strong></div>
        <div class="pill">Edges: <strong id="sEdges">0</strong></div>
        <div class="pill">Est. <strong id="sCost">$0</strong>/mo</div>
    </div>
    <div id="legend">
        <div class="leg-h">Status</div>
        <div class="leg-r"><span class="leg-d" style="background:#22c55e"></span>Running / Active</div>
        <div class="leg-r"><span class="leg-d" style="background:#f59e0b"></span>Pending / Available</div>
        <div class="leg-r"><span class="leg-d" style="background:#6b7280"></span>Stopped</div>
        <div class="leg-r"><span class="leg-d" style="background:#ef4444"></span>Error / Failed</div>
    </div>
    <div id="emptyState">
        <div class="es-icon">🗺️</div>
        <p>No resources found</p>
        <a href="/">Ask the agent to scan your cloud</a>
    </div>
</div>

<div id="tooltip"></div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const NW = 172, NH = 78;          // node width / height
const COL_PAD = 90, ROW_PAD = 20; // gap between columns / rows

const ICONS = {
    ec2:'🖥️', rds:'🗄️', s3:'🪣', lambda:'⚡', ebs:'💾',
    elastic_ip:'🌐', vpc:'🔷', cluster:'⚙️', lb:'⚖️',
    loadbalancer:'⚖️', ecs:'📦', dynamodb:'📊', sqs:'📨',
    sns:'📣', elasticache:'⚡', cloudfront:'🌍', api_gateway:'🔌',
};
const PICO = { aws:'☁️', azure:'🔷', gcp:'🟡', kubernetes:'⚙️', docker:'🐳' };

// ── State ─────────────────────────────────────────────────────────────────────
let allNodes = [], allEdges = [], filter = 'all';
let scale = 1, tx = 0, ty = 0;
let panning = false, panStart = null;
let positions = {};   // id → {x, y}

// ── Pan / zoom ────────────────────────────────────────────────────────────────
function applyT() {
    document.getElementById('world').style.transform =
        `translate(${tx}px,${ty}px) scale(${scale})`;
}

function zoom(f) {
    const vp = document.getElementById('viewport');
    const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
    tx = cx - (cx - tx) * f;
    ty = cy - (cy - ty) * f;
    scale = Math.max(0.15, Math.min(3, scale * f));
    applyT();
}

function fitView() {
    const ids = Object.keys(positions);
    if (!ids.length) return;
    let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
    ids.forEach(id => {
        const p = positions[id];
        x0=Math.min(x0,p.x); y0=Math.min(y0,p.y);
        x1=Math.max(x1,p.x+NW); y1=Math.max(y1,p.y+NH);
    });
    const vp = document.getElementById('viewport');
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const pad = 60;
    scale = Math.min((vw-pad*2)/(x1-x0), (vh-pad*2)/(y1-y0), 1.6);
    tx = (vw - (x1-x0)*scale)/2 - x0*scale;
    ty = (vh - (y1-y0)*scale)/2 - y0*scale;
    applyT();
}

// Pan
const vp = document.getElementById('viewport');
vp.addEventListener('mousedown', e => {
    if (e.target.closest('.nd')) return;
    panning=true; panStart={x:e.clientX-tx, y:e.clientY-ty};
});
window.addEventListener('mousemove', e => {
    if (!panning) return;
    tx=e.clientX-panStart.x; ty=e.clientY-panStart.y; applyT();
});
window.addEventListener('mouseup', () => panning=false);
vp.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 0.9;
    const r = vp.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    tx = mx - (mx-tx)*f; ty = my - (my-ty)*f;
    scale = Math.max(0.15, Math.min(3, scale*f));
    applyT();
}, {passive:false});

// ── Layout ────────────────────────────────────────────────────────────────────
function layout(nodes, edges) {
    if (!nodes.length) return {};
    const inDeg = {}, adj = {};
    nodes.forEach(n => { inDeg[n.id]=0; adj[n.id]=[]; });
    edges.forEach(e => {
        if (inDeg[e.target]!==undefined && adj[e.source]) {
            adj[e.source].push(e.target);
            inDeg[e.target]++;
        }
    });

    // BFS layers
    const layers=[], visited=new Set();
    let q = nodes.filter(n => inDeg[n.id]===0).map(n=>n.id);
    while (q.length) {
        layers.push([...q]);
        q.forEach(id=>visited.add(id));
        const next=[];
        q.forEach(id=>{
            (adj[id]||[]).forEach(t=>{
                if (!visited.has(t)){ inDeg[t]--; if(inDeg[t]===0) next.push(t); }
            });
        });
        q=next;
    }
    // anything left (cycles / isolated)
    nodes.forEach(n=>{ if(!visited.has(n.id)) layers.push([n.id]); });

    // Compute max column height for vertical centering
    const maxColH = Math.max(...layers.map(l => l.length*(NH+ROW_PAD) - ROW_PAD));

    const pos={};
    let x=40;
    layers.forEach(layer => {
        const colH = layer.length*(NH+ROW_PAD) - ROW_PAD;
        const startY = 40 + (maxColH - colH) / 2; // center shorter columns
        layer.forEach((id, i) => {
            pos[id] = { x, y: startY + i*(NH+ROW_PAD) };
        });
        x += NW + COL_PAD;
    });
    return pos;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
    const world = document.getElementById('world');
    // Remove old nodes (keep SVG)
    Array.from(world.children).forEach(c => { if(c.id!=='edgeSvg') world.removeChild(c); });

    const vis = filter==='all' ? allNodes
        : allNodes.filter(n => n.provider===filter || n.group);
    const visSet = new Set(vis.map(n=>n.id));
    const visEdges = allEdges.filter(e => visSet.has(e.source)&&visSet.has(e.target));

    const real = vis.filter(n=>!n.group);
    if (!real.length) {
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('statsBar').style.display='none';
        document.getElementById('edgeSvg').innerHTML='<defs></defs>';
        return;
    }
    document.getElementById('emptyState').classList.add('hidden');

    // Stats
    const cost = real.reduce((s,n)=>s+(n.cost||0),0);
    document.getElementById('sNodes').textContent = real.length;
    document.getElementById('sEdges').textContent = visEdges.length;
    document.getElementById('sCost').textContent = '$'+cost.toFixed(2);
    document.getElementById('statsBar').style.display='flex';

    // Layout
    positions = layout(vis, visEdges);

    // World size
    let maxX=0, maxY=0;
    Object.values(positions).forEach(p=>{ maxX=Math.max(maxX,p.x+NW+60); maxY=Math.max(maxY,p.y+NH+60); });
    world.style.width  = maxX+'px';
    world.style.height = maxY+'px';

    // SVG
    const svg = document.getElementById('edgeSvg');
    svg.setAttribute('width', maxX);
    svg.setAttribute('height', maxY);
    svg.style.width=maxX+'px'; svg.style.height=maxY+'px';
    svg.innerHTML = `<defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3z" fill="#6366f1" opacity=".8"/>
        </marker>
        <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3z" fill="#4b5563" opacity=".8"/>
        </marker>
    </defs>`;

    // Nodes
    const elMap={};
    vis.forEach(n => {
        const p = positions[n.id]; if(!p) return;
        const el = makeNode(n, p);
        world.appendChild(el);
        elMap[n.id]=el;
    });

    // Edges (after nodes are in DOM so offsetHeight works)
    requestAnimationFrame(()=>{
        visEdges.forEach(e => drawEdge(svg, e, elMap));
    });

    fitView();
}

function makeNode(n, p) {
    const el = document.createElement('div');
    el.className = 'nd' + (n.group?' grp':'');
    el.style.left = p.x+'px';
    el.style.top  = p.y+'px';
    if(n.group) el.style.width='188px';
    el.dataset.id = n.id;

    const icon = ICONS[n.type] || PICO[n.provider] || '📦';
    const iClass = 'i-'+n.type;
    const st = (n.status||'unknown').toLowerCase().replace(/[^a-z]/g,'');
    const costStr = (n.cost>0) ? '$'+n.cost.toFixed(2)+'/mo' : '';
    const subTrunc = (n.sub||'').length>22 ? (n.sub||'').slice(0,21)+'…' : (n.sub||'');
    const nameTrunc = (n.label||'').length>18 ? (n.label||'').slice(0,17)+'…' : (n.label||'');

    el.innerHTML = `
        <div class="nd-head">
            <div class="nd-ico ${iClass}">${icon}</div>
            <div class="nd-name" title="${esc(n.label)}">${esc(nameTrunc)}</div>
        </div>
        <div class="nd-sub">${esc(subTrunc)}</div>
        <div class="nd-foot">
            <span class="nd-st ${st}">${st}</span>
            ${costStr?`<span class="nd-cost">${costStr}</span>`:''}
        </div>`;

    el.addEventListener('mouseenter', e => showTip(e.clientX, e.clientY, n));
    el.addEventListener('mouseleave', hideTip);
    return el;
}

function drawEdge(svg, edge, elMap) {
    const sp = positions[edge.source], tp = positions[edge.target];
    if(!sp||!tp) return;
    const srcEl = elMap[edge.source], tgtEl = elMap[edge.target];
    const srcW = (srcEl?.offsetWidth||NW), srcH = (srcEl?.offsetHeight||NH)/2;
    const tgtH = (tgtEl?.offsetHeight||NH)/2;

    const x1=sp.x+srcW, y1=sp.y+srcH;
    const x2=tp.x,      y2=tp.y+tgtH;
    const mx=(x1+x2)/2;
    const isGrp = allNodes.find(n=>n.id===edge.source)?.group;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', isGrp?'#4b5563':'#6366f1');
    path.setAttribute('stroke-width', isGrp?'1.5':'2');
    path.setAttribute('stroke-dasharray', isGrp?'6,4':'none');
    path.setAttribute('opacity','.75');
    path.setAttribute('marker-end', isGrp?'url(#arr2)':'url(#arr)');
    svg.appendChild(path);

    if(edge.label) {
        const t=document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x', mx); t.setAttribute('y', (y1+y2)/2-6);
        t.setAttribute('text-anchor','middle'); t.setAttribute('class','elabel');
        t.textContent=edge.label;
        svg.appendChild(t);
    }
}

// ── Filters ───────────────────────────────────────────────────────────────────
function buildFilters() {
    const providers=[...new Set(allNodes.filter(n=>!n.group).map(n=>n.provider))];
    const bar=document.getElementById('filterBar');
    bar.innerHTML='<span class="fc-label">Filter:</span>';
    const a=btn('all','All',true); bar.appendChild(a);
    providers.forEach(p=>{
        bar.appendChild(btn(p,(PICO[p]||'')+' '+p.toUpperCase(),false));
    });
}
function btn(prov,label,active){
    const b=document.createElement('button');
    b.className='fc'+(active?' on':''); b.dataset.p=prov;
    b.textContent=label; b.onclick=()=>setFilter(b,prov);
    return b;
}
function setFilter(el,prov){
    document.querySelectorAll('.fc').forEach(b=>b.classList.remove('on'));
    el.classList.add('on'); filter=prov; render();
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
let _tipHideTimer = null;

function showTip(mx, my, n){
    if (_tipHideTimer) { clearTimeout(_tipHideTimer); _tipHideTimer = null; }
    const tip=document.getElementById('tooltip');
    const rows=[
        ['Type',n.type],['Provider',n.provider],
        n.region?['Region',n.region]:null,
        n.status?['Status',n.status]:null,
        n.cost>0?['Est. cost','$'+n.cost.toFixed(2)+'/mo']:null,
        n.sub!==n.label?['ID',n.sub]:null,
    ].filter(Boolean);
    const investigateUrl = '/chat?ctx=resource'
        + '&type=' + encodeURIComponent(n.type || 'resource')
        + '&id='   + encodeURIComponent(n.id)
        + '&name=' + encodeURIComponent(n.label || n.id)
        + '&action=investigate';
    tip.innerHTML='<strong>'+esc(n.label)+'</strong>'+
        rows.map(([k,v])=>`<div><span class="tip-k">${k}: </span><span class="tip-v">${esc(String(v))}</span></div>`).join('')+
        `<div><a class="tip-investigate" href="${investigateUrl}" target="_blank">Investigate →</a></div>`;
    tip.style.display='block';
    tip.style.left=(mx+14)+'px'; tip.style.top=(my+14)+'px';
}
function hideTip(){
    _tipHideTimer = setTimeout(()=>{ document.getElementById('tooltip').style.display='none'; }, 300);
}
document.getElementById('tooltip').addEventListener('mouseenter', ()=>{
    if (_tipHideTimer) { clearTimeout(_tipHideTimer); _tipHideTimer = null; }
});
document.getElementById('tooltip').addEventListener('mouseleave', ()=>{
    _tipHideTimer = setTimeout(()=>{ document.getElementById('tooltip').style.display='none'; }, 150);
});
document.addEventListener('mousemove',e=>{
    const t=document.getElementById('tooltip');
    if(t.style.display==='block' && !t.matches(':hover')){
        t.style.left=(e.clientX+14)+'px'; t.style.top=(e.clientY+14)+'px';
    }
});

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadMap(){
    try{
        const r=await fetch('/api/infrastructure/topology');
        const d=await r.json();
        allNodes=d.nodes||[]; allEdges=d.edges||[];
        buildFilters();
        render();
    }catch(e){
        document.getElementById('emptyState').classList.remove('hidden');
    }
}

function esc(s){
    const d=document.createElement('div');
    d.appendChild(document.createTextNode(String(s)));
    return d.innerHTML;
}

loadMap();
window.addEventListener('resize', fitView);
</script>
