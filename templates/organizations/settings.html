{% extends "base.html" %}
{% block title %}Organization Settings - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Organization Settings</h1>
        <a href="{{ url_for('organizations.view_organization', org_id=organization.id) }}" class="btn btn-secondary">Back</a>
    </div>
    <div class="card">
        <div class="card-header"><h3>General Settings</h3></div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>Organization Name:</label>
                    <input type="text" name="name" class="form-control" value="{{ organization.name }}" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea name="description" class="form-control" rows="3">{{ organization.description or '' }}</textarea>
                </div>
                <div class="form-group">
                    <label>Billing Email:</label>
                    <input type="email" name="billing_email" class="form-control" value="{{ organization.billing_email or '' }}">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
    <div class="card mt-4">
        <div class="card-header"><h3>Danger Zone</h3></div>
        <div class="card-body">
            <p class="text-danger">These actions are irreversible.</p>
            <button class="btn btn-danger" onclick="deleteOrganization()">Delete Organization</button>
        </div>
    </div>
</div>
<style>
.container { padding: 20px; max-width: 800px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
.card-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
.card-body { padding: 20px; }
.form-group { margin-bottom: 15px; }
.form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; }
</style>
<script>
function deleteOrganization() {
    if (confirm('Are you sure you want to delete this organization? This cannot be undone.')) {
        fetch('/organizations/{{ organization.id }}/delete', {method: 'POST'}).then(() => {
            window.location.href = '/organizations/';
        });
    }
}
</script>
{% endblock %}
