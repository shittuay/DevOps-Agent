{% extends "base.html" %}
{% block title %}Create Team - DevOps Agent{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Create Team</h1>
        <a href="{{ url_for('organizations.list_teams', org_id=org.id) }}" class="btn btn-secondary">Back to Teams</a>
    </div>
    <div class="form-card">
        <form method="POST" action="{{ url_for('organizations.create_team', org_id=org.id) }}">
            <div class="form-group">
                <label for="name">Team Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Platform Engineering" class="form-control">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="What does this team do?" class="form-control"></textarea>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('organizations.list_teams', org_id=org.id) }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Team</button>
            </div>
        </form>
    </div>
</div>
<style>
.container { padding: 20px; max-width: 600px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.form-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-weight: 500; margin-bottom: 6px; }
.form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-primary); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; }
.form-control:focus { outline: none; border-color: var(--accent-primary); }
textarea.form-control { resize: vertical; }
.form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
</style>
{% endblock %}
