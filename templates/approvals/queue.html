{% extends "base.html" %}
{% block title %}Approval Queue — DevOps Agent{% endblock %}
{% block content %}
<style>
    .queue-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
    }
    .queue-header h1 {
        font-family: 'Syne', sans-serif;
        font-size: 26px;
        font-weight: 700;
    }
    .count-badge {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 14px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
    }
    .risk-critical {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
    }
    .risk-high {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
    }
    .tool-name {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        color: var(--accent-primary);
    }
    .risk-reason {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
    }
    .action-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
    }
    .note-area {
        display: none;
        margin-top: 8px;
    }
    .note-area.open { display: flex; gap: 8px; align-items: center; }
    .note-input {
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
        flex: 1;
    }
    .note-input:focus { outline: none; border-color: var(--accent-primary); }
    .btn-approve {
        padding: 6px 14px;
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-approve:hover { background: rgba(16, 185, 129, 0.25); }
    .btn-reject {
        padding: 6px 14px;
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-reject:hover { background: rgba(239, 68, 68, 0.25); }
    .status-msg {
        font-size: 13px;
        padding: 4px 0;
    }
    .empty-queue {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
        font-family: 'IBM Plex Mono', monospace;
    }
    .age {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        color: var(--text-secondary);
    }
    .type-badge-agent {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        background: rgba(99,102,241,0.15);
        color: #818cf8;
        margin-bottom: 4px;
    }
    .type-badge-change {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        background: rgba(245,158,11,0.15);
        color: #f59e0b;
        margin-bottom: 4px;
    }
</style>

<div class="queue-header">
    <h1>Pending Approvals</h1>
    <span class="count-badge" id="countBadge">0</span>
    <a href="/approvals/history" style="margin-left:auto;padding:5px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);border-radius:8px;font-size:13px;color:var(--text-secondary);text-decoration:none;font-family:'IBM Plex Mono',monospace;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent-primary)';this.style.color='var(--accent-primary)'" onmouseout="this.style.borderColor='var(--border-subtle)';this.style.color='var(--text-secondary)'">View History →</a>
</div>

<div class="card" style="overflow: hidden;">
    <table id="queueTable">
        <thead>
            <tr>
                <th>Requester</th>
                <th>Tool</th>
                <th>Risk</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="queueBody">
            <tr>
                <td colspan="5"><div class="empty-queue">Loading...</div></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
let requests = [];
// Map from row key ("agent-{id}" or "change-{id}") to request object
const requestMap = {};

function rowKey(r) {
    return `${r._type}-${r.id}`;
}

function timeAgo(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    return h + 'h ago';
}

async function loadQueue() {
    try {
        const res = await fetch('/api/approvals/pending');
        if (!res.ok) return;
        requests = await res.json();
        // Default legacy entries (no _type) to agent
        requests.forEach(r => { if (!r._type) r._type = 'agent'; });
        requests.forEach(r => { requestMap[rowKey(r)] = r; });
        renderQueue();
    } catch (e) {
        console.error('Failed to load queue', e);
    }
}

function renderQueue() {
    const tbody = document.getElementById('queueBody');
    const badge = document.getElementById('countBadge');
    badge.textContent = requests.length;

    if (!requests.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-queue">No pending approvals</div></td></tr>';
        return;
    }

    tbody.innerHTML = requests.map(r => {
        const key = rowKey(r);
        const typeBadge = r._type === 'change'
            ? '<span class="type-badge-change">Change Request</span>'
            : '<span class="type-badge-agent">Agent</span>';
        return `
        <tr id="row-${key}">
            <td><strong>${escHtml(r.requester_name || 'Unknown')}</strong></td>
            <td>
                <div>${typeBadge}</div>
                <div class="tool-name">${escHtml(r.tool_name)}</div>
                <div class="risk-reason">${escHtml(r.risk_reason)}</div>
                ${r.tool_name === 'grant_aws_permission' && r.tool_input && r.tool_input.policy
                    ? `<pre style="font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0;">${escHtml(JSON.stringify(r.tool_input.policy, null, 2))}</pre>${r.tool_input.mode !== 'self' && r.tool_input.manual && r.tool_input.manual.cli ? `<pre style="font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0;">${escHtml(r.tool_input.manual.cli)}</pre>` : ''}`
                    : ''}
            </td>
            <td><span class="risk-${r.risk_level}">${r.risk_level.toUpperCase()}</span></td>
            <td class="age">${timeAgo(r.created_at)}</td>
            <td>
                <div class="action-row">
                    <button class="btn-approve" onclick="startApprove('${key}')">Approve</button>
                    <button class="btn-reject" onclick="startReject('${key}')">Reject</button>
                </div>
                <div class="note-area" id="note-${key}">
                    <input class="note-input" id="note-input-${key}" placeholder="Optional note..." />
                    <button class="btn-approve" id="confirm-approve-${key}" onclick="confirmApprove('${key}')" style="display:none">Confirm Approve</button>
                    <button class="btn-reject" id="confirm-reject-${key}" onclick="confirmReject('${key}')" style="display:none">Confirm Reject</button>
                    <button class="btn-secondary" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);border-radius:8px;font-size:13px;cursor:pointer;color:var(--text-secondary)" onclick="cancelNote('${key}')">Cancel</button>
                </div>
                <div class="status-msg" id="status-${key}"></div>
            </td>
        </tr>`;
    }).join('');
}

function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startApprove(key) {
    const note = document.getElementById(`note-${key}`);
    note.classList.add('open');
    document.getElementById(`confirm-approve-${key}`).style.display = '';
    document.getElementById(`confirm-reject-${key}`).style.display = 'none';
}

function startReject(key) {
    const note = document.getElementById(`note-${key}`);
    note.classList.add('open');
    document.getElementById(`confirm-reject-${key}`).style.display = '';
    document.getElementById(`confirm-approve-${key}`).style.display = 'none';
}

function cancelNote(key) {
    document.getElementById(`note-${key}`).classList.remove('open');
}

async function confirmApprove(key) {
    const r = requestMap[key];
    if (!r) return;
    const note = document.getElementById(`note-input-${key}`).value.trim() || null;
    setStatus(key, 'Approving...');
    try {
        let url, body;
        if (r._type === 'change') {
            url = `/api/changes/${r.id}/approve`;
            body = JSON.stringify({ comment: note || '' });
        } else {
            url = `/api/approvals/${r.id}/approve`;
            body = JSON.stringify({ note });
        }
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body,
        });
        const data = await res.json();
        if (res.ok) {
            const msg = r._type === 'change'
                ? 'Approved — go to Changes to execute.'
                : 'Approved — tool executed.';
            setStatus(key, msg);
            document.getElementById(`row-${key}`).style.opacity = '0.4';
            setTimeout(loadQueue, 1500);
        } else {
            setStatus(key, 'Error: ' + (data.error || 'Unknown'));
        }
    } catch (e) {
        setStatus(key, 'Request failed.');
    }
}

async function confirmReject(key) {
    const r = requestMap[key];
    if (!r) return;
    const note = document.getElementById(`note-input-${key}`).value.trim() || null;
    setStatus(key, 'Rejecting...');
    try {
        let url, body;
        if (r._type === 'change') {
            url = `/api/changes/${r.id}/reject`;
            body = JSON.stringify({ reason: note || 'Rejected from approvals queue' });
        } else {
            url = `/api/approvals/${r.id}/reject`;
            body = JSON.stringify({ note });
        }
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body,
        });
        const data = await res.json();
        if (res.ok) {
            setStatus(key, 'Rejected.');
            document.getElementById(`row-${key}`).style.opacity = '0.4';
            setTimeout(loadQueue, 1500);
        } else {
            setStatus(key, 'Error: ' + (data.error || 'Unknown'));
        }
    } catch (e) {
        setStatus(key, 'Request failed.');
    }
}

function setStatus(key, msg) {
    const el = document.getElementById(`status-${key}`);
    if (el) el.textContent = msg;
}

loadQueue();
setInterval(loadQueue, 15000);
</script>
{% endblock %}
