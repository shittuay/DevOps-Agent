server {
    listen 80;
    server_name your_domain_or_ip;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Increased timeouts for long-running operations. proxy_read_timeout is
        # an *idle* timeout between reads, and /api/chat emits a keep-alive byte
        # every 15s, so this is a ceiling on a stalled upstream rather than on
        # turn length — but it must still out-wait CHAT_MAX_TURN_SECONDS (840s),
        # since that is the longest the app will legitimately hold a response
        # open before closing it out itself.
        proxy_read_timeout 900;
        proxy_connect_timeout 300;
        proxy_send_timeout 900;
        # Never buffer an agent response: buffering swallows the keep-alive
        # bytes the 524 fix depends on. The app also sends X-Accel-Buffering: no.
        proxy_buffering off;
    }

    location /static {
        alias /var/www/devops-agent/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
