name: Check AI provider keys

# Probes the Claude, Kimi and Groq keys the server loads from Secrets Manager and prints
# only HTTP status codes and key-shape facts (never a key). Results also appear as
# annotations, which can be read through the API when the job log can't be downloaded.
on:
  workflow_dispatch:
  push:
    branches: [diag-ai-keys]

jobs:
  check-keys:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::188046727805:role/github-actions-deploy' }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Probe keys via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/probe.sh << 'SCRIPT'
        #!/bin/bash
        cd /var/www/devops-agent
        venv/bin/python3 - << 'PYEOF' 2>&1
        import re, requests
        from services.secrets_manager import get_all_secrets
        s = get_all_secrets() or {}
        checks = [
            ('ANTHROPIC_API_KEY', 'sk-ant-', 'https://api.anthropic.com/v1/models',
             lambda k: {'x-api-key': k, 'anthropic-version': '2023-06-01'}),
            ('MOONSHOT_API_KEY', 'sk-', 'https://api.moonshot.ai/v1/models',
             lambda k: {'Authorization': 'Bearer ' + k}),
            ('GROQ_API_KEY', 'gsk_', 'https://api.groq.com/openai/v1/models',
             lambda k: {'Authorization': 'Bearer ' + k}),
        ]
        for name, prefix, url, headers in checks:
            raw = s.get(name)
            if not raw:
                print(f'RESULT {name}: missing from the secret')
                continue
            key = raw.strip()
            inner_space = bool(re.search(r'\s', key))
            shape = (f'len={len(raw)} prefix_ok={key.startswith(prefix)} '
                     f'extra_whitespace={raw != key} inner_space={inner_space}')
            try:
                code = requests.get(url, headers=headers(key), timeout=15).status_code
            except Exception as exc:
                code = type(exc).__name__
            print(f'RESULT {name}: http={code} {shape}')
        PYEOF
        SCRIPT

        CMD=$(jq -Rs . /tmp/probe.sh)
        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 120 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
          case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          sleep 4
        done

        OUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)
        echo "$OUT"
        echo "$OUT" | grep '^RESULT' | while IFS= read -r line; do
          echo "::notice title=AI key check::${line}"
        done
        echo "$OUT" | grep -q '^RESULT' || { echo "::error title=AI key check::status=$STATUS, no results"; echo "$OUT" | tail -5 | while IFS= read -r l; do echo "::error title=AI key check output::$l"; done; exit 1; }
