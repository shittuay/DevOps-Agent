name: Check AI provider keys

# Probes the Claude, Kimi and Groq keys the server loads from Secrets Manager and prints
# only HTTP status codes and key-shape facts (never a key). Results also appear as
# annotations, which can be read through the API when the job log can't be downloaded.
on:
  workflow_dispatch:
  push:
    branches: [diag-ai-keys]

jobs:
  check-keys:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::188046727805:role/github-actions-deploy' }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Probe keys via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/probe.sh << 'SCRIPT'
        #!/bin/bash
        cd /var/www/devops-agent
        venv/bin/python3 - << 'PYEOF' 2>&1
        import re, requests
        from services.secrets_manager import get_all_secrets
        import boto3, json
        sm = boto3.client('secretsmanager', region_name='us-east-1')
        for sid in ('devops-agent/production', 'ANTHROPIC_API_KEY'):
            try:
                v = sm.get_secret_value(SecretId=sid)
                body = v.get('SecretString') or ''
                try:
                    names = sorted(json.loads(body).keys())
                    print(f'RESULT secret {sid}: JSON keys={names} updated={v.get("CreatedDate")}')
                except Exception:
                    print(f'RESULT secret {sid}: not JSON, length={len(body)}')
            except Exception as exc:
                print(f'RESULT secret {sid}: cannot read ({type(exc).__name__}: {str(exc)[:150]})')
        envfile = {}
        try:
            for line in open('.env'):
                if '=' in line and not line.lstrip().startswith('#'):
                    k, _, val = line.strip().partition('=')
                    envfile[k.strip()] = val.strip().strip('"').strip("'")
        except Exception:
            pass
        try:
            prod = json.loads(sm.get_secret_value(SecretId='devops-agent/production')['SecretString'])
            ck = (prod.get('CLAUDE_API_KEY') or '').strip()
            if ck:
                h = {'x-api-key': ck, 'anthropic-version': '2023-06-01', 'content-type': 'application/json'}
                r = requests.get('https://api.anthropic.com/v1/models', timeout=15, headers=h)
                print(f'RESULT secret CLAUDE_API_KEY models: http={r.status_code} body={r.text[:200]}')
                r = requests.post('https://api.anthropic.com/v1/messages', timeout=30, headers=h,
                                  json={'model': 'claude-sonnet-4-6', 'max_tokens': 5,
                                        'messages': [{'role': 'user', 'content': 'hi'}]})
                print(f'RESULT secret CLAUDE_API_KEY messages(claude-sonnet-4-6): http={r.status_code} body={r.text[:200]}')
        except Exception as exc:
            print(f'RESULT secret CLAUDE_API_KEY probe failed: {type(exc).__name__}')
        print('RESULT FLASK_ENV in .env = ' + repr(envfile.get('FLASK_ENV', '')))
        import os as _os
        print('RESULT config/.env exists = ' + str(_os.path.exists('config/.env')))
        print('RESULT .env has: ' + ', '.join(f'{k}={k in envfile}' for k in ('ANTHROPIC_API_KEY', 'MOONSHOT_API_KEY', 'GROQ_API_KEY', 'FLASK_ENV', 'USE_AWS_SECRETS')))
        s = get_all_secrets() or {}
        for k in ('ANTHROPIC_API_KEY', 'MOONSHOT_API_KEY', 'GROQ_API_KEY'):
            if not s.get(k) and envfile.get(k):
                s[k] = envfile[k]
                print(f'RESULT {k}: using the .env value for the probe below')
        checks = [
            ('ANTHROPIC_API_KEY', 'sk-ant-', 'https://api.anthropic.com/v1/models',
             lambda k: {'x-api-key': k, 'anthropic-version': '2023-06-01'}),
            ('MOONSHOT_API_KEY', 'sk-', 'https://api.moonshot.ai/v1/models',
             lambda k: {'Authorization': 'Bearer ' + k}),
            ('GROQ_API_KEY', 'gsk_', 'https://api.groq.com/openai/v1/models',
             lambda k: {'Authorization': 'Bearer ' + k}),
        ]
        for name, prefix, url, headers in checks:
            raw = s.get(name)
            if not raw:
                print(f'RESULT {name}: missing from the secret')
                continue
            key = raw.strip()
            inner_space = bool(re.search(r'\s', key))
            shape = (f'len={len(raw)} prefix_ok={key.startswith(prefix)} '
                     f'extra_whitespace={raw != key} inner_space={inner_space}')
            try:
                r = requests.get(url, headers=headers(key), timeout=15)
                code = r.status_code
                detail = '' if code == 200 else ' body=' + r.text[:160]
            except Exception as exc:
                code, detail = type(exc).__name__, ''
            print(f'RESULT {name}: http={code} {shape}{detail}')
            if name == 'ANTHROPIC_API_KEY' and code == 200:
                for model in ('claude-sonnet-4-6', 'claude-opus-4-6', 'claude-haiku-4-5-20251001'):
                    r = requests.post('https://api.anthropic.com/v1/messages', timeout=30,
                                      headers={**headers(key), 'content-type': 'application/json'},
                                      json={'model': model, 'max_tokens': 5,
                                            'messages': [{'role': 'user', 'content': 'hi'}]})
                    print(f'RESULT model {model}: http={r.status_code}' + ('' if r.status_code == 200 else ' body=' + r.text[:160]))
        PYEOF
        echo "=== agent claude call ==="
        set -a; . ./.env; set +a
        timeout 90 venv/bin/python3 - << 'PYEOF2' 2>&1 | grep -E "^RESULT" | head -20
        import os, traceback
        from services.secrets_manager import init_secrets
        print('RESULT init_secrets=' + str(init_secrets()))
        try:
            from src.config.config_manager import ConfigManager
            from src.agent.core import DevOpsAgent
            from src.tools import command_tools, verification_tools, aws_tools, devops_operations_tools
            cm = ConfigManager()
            print('RESULT claude_model config=' + repr(cm.claude_model) + ' max_tokens=' + repr(cm.claude_max_tokens))
            a = DevOpsAgent(cm)
            for m in (command_tools, verification_tools, aws_tools, devops_operations_tools):
                a.register_tools_from_module(m)
            out = ''.join(str(c) for c in a.process_message_streaming(
                user_message='Reply with the single word hello.', conversation_history=[],
                user_id=None, model_override='claude-sonnet-4-6', provider=None, max_tools=40))
            print('RESULT agent output: ' + out[:400].replace('\n', ' '))
        except Exception:
            print('RESULT agent exception: ' + traceback.format_exc()[-600:].replace('\n', ' | '))
        PYEOF2
        SCRIPT

        CMD=$(jq -Rs . /tmp/probe.sh)
        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 120 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
          case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          sleep 4
        done

        OUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)
        echo "$OUT"
        echo "$OUT" | grep '^RESULT' | while IFS= read -r line; do
          echo "::notice title=AI key check::${line}"
        done
        echo "$OUT" | grep -q '^RESULT' || { echo "::error title=AI key check::status=$STATUS, no results"; echo "$OUT" | tail -5 | while IFS= read -r l; do echo "::error title=AI key check output::$l"; done; exit 1; }
