name: Diagnose MCP Connector

# On-demand: shows what the server saw during the last claude.ai connector attempts.
# Prints request paths/status codes, the app's MCP auth log lines, and OAuth token
# METADATA only (never token values). Run it right after a failed "Connect".

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::188046727805:role/github-actions-deploy' }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Collect MCP evidence via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/mcp.sh << 'SCRIPT'
        #!/bin/bash
        CODE=/var/www/devops-agent
        VENV=$CODE/venv
        export DB_URL=$(grep -E '^DATABASE_URL' $CODE/.env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
        ERRLOG=/var/log/devops-agent-error.log
        ACCLOG=/var/log/devops-agent-access.log
        MCP_PATHS='/mcp|/\.well-known/oauth|"(GET|POST) /(authorize|token|register)|"POST / '

        echo "=== MCP/OAUTH REQUESTS (gunicorn access log, last 70) ==="
        [ -f "$ACCLOG" ] && grep -E "$MCP_PATHS" "$ACCLOG" | grep -v '/mcp/health' | tail -70 || echo "(no access log)"

        echo ""
        echo "=== NGINX VIEW OF THE SAME (last 40; shows 429/499/5xx from the proxy layer) ==="
        for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
          [ -f "$f" ] && grep -E "$MCP_PATHS" "$f" | grep -v '/mcp/health' | tail -40
        done

        echo ""
        echo "=== APP MCP LOG LINES (last 80) ==="
        [ -f "$ERRLOG" ] && grep -E "MCP|OAuth|oauth" "$ERRLOG" | tail -80 || echo "(none)"

        echo ""
        echo "=== RATE LIMIT HITS ON MCP PATHS (app + nginx) ==="
        [ -f "$ACCLOG" ] && grep -E "$MCP_PATHS" "$ACCLOG" | grep -c '" 429 ' || true

        echo ""
        echo "=== OAUTH TABLES (metadata only, no token values) ==="
        "$VENV/bin/python3" - << 'PYEOF' 2>&1
        import os
        db_url = os.environ.get('DB_URL', '')
        try:
            import psycopg2
            pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
            con = psycopg2.connect(pg_url); cur = con.cursor()
            for table in ('mcp_oauth_tokens', 'mcp_oauth_codes', 'mcp_oauth_clients'):
                cur.execute("SELECT column_name, data_type, character_maximum_length FROM information_schema.columns "
                            "WHERE table_name=%s ORDER BY ordinal_position", (table,))
                cols = cur.fetchall()
                print(f"{table} columns: " + (", ".join(f"{c}:{t}{'(' + str(n) + ')' if n else ''}" for c, t, n in cols) or "TABLE MISSING"))
            cur.execute("SELECT token_kind, COUNT(*), MAX(created_at) FROM mcp_oauth_tokens "
                        "WHERE created_at >= NOW() - INTERVAL '2 days' GROUP BY token_kind")
            print("tokens issued in last 2 days:", cur.fetchall())
            cur.execute("SELECT id, user_id, token_kind, client_id, LENGTH(token), created_at, expires_at, NOW() AT TIME ZONE 'UTC' "
                        "FROM mcp_oauth_tokens ORDER BY id DESC LIMIT 6")
            print("latest tokens (id, user, kind, client_id, token_len, created_at, expires_at, db_now_utc):")
            for r in cur.fetchall():
                print("  ", r)
            cur.execute("SELECT client_id, client_name, redirect_uris, created_at FROM mcp_oauth_clients ORDER BY id DESC LIMIT 5")
            print("latest registered clients:")
            for r in cur.fetchall():
                print("  ", r)
            cur.execute("SELECT COUNT(*) FROM mcp_oauth_codes")
            print("unused auth codes:", cur.fetchone()[0])
            con.close()
        except Exception as e:
            print(f"Query error: {e}")
        PYEOF

        echo ""
        echo "=== SERVER CLOCK ==="
        date -u; timedatectl 2>/dev/null | grep -E "synchronized|NTP" || true

        echo ""
        echo "=== DONE ==="
        SCRIPT

        CMD=$(jq -Rs . /tmp/mcp.sh)
        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 120 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/30] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo ""
        echo "=== OUTPUT ==="
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text
        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
