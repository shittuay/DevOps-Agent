name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Run migration via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        CMD=$(jq -Rn '"#!/bin/bash\necho \"=== /home/ubuntu/app/DevOps-Agent ===\"\nls -lah /home/ubuntu/app/DevOps-Agent/ 2>/dev/null || echo \"(missing)\"\necho \"\"\necho \"=== /home/ubuntu/app/DevOps-Agent/instance ===\"\nls -lah /home/ubuntu/app/DevOps-Agent/instance/ 2>/dev/null || echo \"(missing)\"\necho \"\"\necho \"=== /var/www/devops-agent ===\"\nls -lah /var/www/devops-agent/ 2>/dev/null || echo \"(missing)\"\necho \"\"\necho \"=== /var/www/devops-agent/instance ===\"\nls -lah /var/www/devops-agent/instance/ 2>/dev/null || echo \"(missing)\"\necho \"\"\necho \"=== Service config ===\"\nsystemctl cat devops-agent\necho \"\"\necho \"=== Git log (app dir) ===\"\nsudo -u ubuntu git -C /home/ubuntu/app/DevOps-Agent log --oneline -5 2>/dev/null || echo \"(not a git repo)\"\necho \"\"\necho \"=== Git log (var/www dir) ===\"\nsudo -u ubuntu git -C /var/www/devops-agent log --oneline -5 2>/dev/null || echo \"(not a git repo)\""')

        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 120 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 24); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/24] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo "=== OUTPUT ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
