name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Merge directories via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/cleanup.sh << 'SCRIPT'
        #!/bin/bash
        set -e

        echo "=== Directories before cleanup ==="
        ls -lah /home/ubuntu/ | grep -E "DevOps-Agent|devops-agent"

        echo ""
        echo "=== Removing /home/ubuntu/DevOps-Agent (unused clone) ==="
        rm -rf /home/ubuntu/DevOps-Agent
        echo "Done"

        echo ""
        echo "=== Removing /home/ubuntu/devops-agent-old-20260509 (archived old install) ==="
        rm -rf /home/ubuntu/devops-agent-old-20260509
        echo "Done"

        echo ""
        echo "=== Directories after cleanup ==="
        ls -lah /home/ubuntu/ | grep -E "DevOps-Agent|devops-agent" || echo "(no other DevOps-Agent dirs)"

        echo ""
        echo "=== Confirming service still running ==="
        systemctl is-active devops-agent
        curl -sf http://localhost:5000/health && echo "HEALTH: OK" || echo "HEALTH: FAIL"

        echo ""
        echo "=== DONE - only /home/ubuntu/app/DevOps-Agent remains ==="
        SCRIPT

        CMD=$(jq -Rs . /tmp/cleanup.sh)

        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 180 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 36); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/36] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo "=== OUTPUT ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
