name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for AssumeRoleWithWebIdentity
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # The access-key secrets this used were deleted in the 2026-07-18 OIDC migration,
    # so this workflow could not authenticate at all until it moved to OIDC too.
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::621203631557:role/github-actions-deploy' }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Patch nginx proxy_read_timeout via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/cleanup.sh << 'SCRIPT'
        #!/bin/bash
        set -e

        echo "=== Current nginx config files ==="
        ls /etc/nginx/sites-enabled/ 2>/dev/null || echo "(no sites-enabled)"
        ls /etc/nginx/conf.d/ 2>/dev/null || echo "(no conf.d)"

        echo ""
        echo "=== Active nginx config ==="
        for f in /etc/nginx/sites-enabled/*; do
          echo "--- $f ---"
          cat "$f"
        done

        echo ""
        echo "=== Current proxy_read_timeout setting ==="
        grep -r proxy_read_timeout /etc/nginx/ 2>/dev/null || echo "not set (default 60s)"

        echo ""
        echo "=== Patching: adding proxy_read_timeout 300 to /api/chat location ==="
        NGINX_CONF=$(ls /etc/nginx/sites-enabled/* 2>/dev/null | head -1)
        if [ -z "$NGINX_CONF" ]; then
          NGINX_CONF=$(ls /etc/nginx/conf.d/* 2>/dev/null | head -1)
        fi

        if [ -z "$NGINX_CONF" ]; then
          echo "ERROR: no nginx config found"
          exit 1
        fi

        echo "Patching: $NGINX_CONF"

        # Check if already patched
        if grep -q "proxy_read_timeout 300" "$NGINX_CONF"; then
          echo "Already patched — proxy_read_timeout 300 present"
        else
          # Add proxy_read_timeout 300 to the main location block (or server block)
          # Add before the last closing brace
          cp "$NGINX_CONF" "${NGINX_CONF}.bak"
          # Insert proxy_read_timeout 300; before the last } of the server block
          sed -i '/^\s*location \/ {/a\        proxy_read_timeout 300;' "$NGINX_CONF"
          echo "Patch applied"
        fi

        echo ""
        echo "=== Testing nginx config ==="
        nginx -t

        echo ""
        echo "=== Reloading nginx ==="
        systemctl reload nginx
        echo "Done"

        echo ""
        echo "=== Verifying patch ==="
        grep proxy_read_timeout "$NGINX_CONF" || echo "(not found — may be in different location)"
        SCRIPT

        CMD=$(jq -Rs . /tmp/cleanup.sh)

        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 180 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 36); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/36] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo "=== OUTPUT ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
