name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Merge directories via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/merge.sh << 'SCRIPT'
        #!/bin/bash
        set -e
        OLD=/var/www/devops-agent
        NEW=/home/ubuntu/app/DevOps-Agent
        DB_SRC=$OLD/instance/devops_agent.db
        DB_DST=$NEW/instance/devops_agent.db
        ARCHIVE=/home/ubuntu/devops-agent-old-$(date +%Y%m%d)

        echo "=== Step 1: Check DATABASE_URL in AWS Secrets Manager ==="
        CURRENT_DB_URL=$(aws secretsmanager get-secret-value \
          --secret-id devops-agent --region us-east-1 \
          --query SecretString --output text 2>/dev/null \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('DATABASE_URL','(not set)'))" \
          2>/dev/null || echo "(secret not found)")
        echo "Current DATABASE_URL: $CURRENT_DB_URL"

        echo ""
        echo "=== Step 2: Stop service ==="
        systemctl stop devops-agent
        echo "Service stopped"

        echo ""
        echo "=== Step 3: Backup DB ==="
        BACKUP="${DB_SRC}.bak.$(date +%Y%m%d_%H%M%S)"
        cp "$DB_SRC" "$BACKUP"
        echo "Backup: $BACKUP"

        echo ""
        echo "=== Step 4: Copy DB to new location ==="
        mkdir -p "$NEW/instance"
        cp "$DB_SRC" "$DB_DST"
        chown ubuntu:ubuntu "$DB_DST"
        ls -lah "$DB_DST"

        echo ""
        echo "=== Step 5: Update DATABASE_URL in AWS Secrets Manager ==="
        NEW_DB_URL="sqlite:////home/ubuntu/app/DevOps-Agent/instance/devops_agent.db"
        CURRENT_SECRET=$(aws secretsmanager get-secret-value \
          --secret-id devops-agent --region us-east-1 \
          --query SecretString --output text 2>/dev/null || echo "{}")
        UPDATED_SECRET=$(echo "$CURRENT_SECRET" | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        d['DATABASE_URL'] = '$NEW_DB_URL'
        print(json.dumps(d))
        ")
        aws secretsmanager update-secret \
          --secret-id devops-agent --region us-east-1 \
          --secret-string "$UPDATED_SECRET" \
          && echo "Secret updated: DATABASE_URL=$NEW_DB_URL" \
          || echo "WARNING: Could not update secret"

        echo ""
        echo "=== Step 6: Start service ==="
        systemctl start devops-agent
        sleep 8
        systemctl is-active devops-agent

        echo ""
        echo "=== Step 7: Health check ==="
        if curl -sf http://localhost:5000/health; then
          echo "HEALTH: OK"
        else
          echo "HEALTH: FAIL - rolling back"
          systemctl stop devops-agent
          cp "$BACKUP" "$DB_SRC"
          systemctl start devops-agent
          exit 1
        fi

        echo ""
        echo "=== Step 8: Verify data in new DB ==="
        python3 - "$DB_DST" << 'PYEOF'
        import sys, sqlite3
        con = sqlite3.connect(sys.argv[1])
        users = con.execute("SELECT COUNT(*) FROM users").fetchone()[0]
        msgs  = con.execute("SELECT COUNT(*) FROM chat_messages").fetchone()[0]
        print(f"Users: {users}, Messages: {msgs}")
        con.close()
        PYEOF

        echo ""
        echo "=== Step 9: Archive old directory ==="
        mv "$OLD" "$ARCHIVE"
        echo "Archived to: $ARCHIVE"

        echo ""
        echo "=== DONE ==="
        echo "DB now at:        $DB_DST"
        echo "Old dir archived: $ARCHIVE"
        SCRIPT

        CMD=$(jq -Rs . /tmp/merge.sh)

        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 180 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 36); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/36] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo "=== OUTPUT ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
