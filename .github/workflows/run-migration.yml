name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Run migration via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        CMD=$(jq -Rn '"#!/bin/bash\nset -e\nDB=$(find /home/ubuntu /var/www -name \"*.db\" 2>/dev/null | head -1)\necho \"DB: $DB\"\necho \"=== Service config ===\"\nsystemctl cat devops-agent | grep -E \"WorkingDirectory|ExecStart|EnvironmentFile\"\necho \"=== Adding missing columns to SQLite ===\"\nsqlite3 \"$DB\" \"ALTER TABLE users ADD COLUMN IF NOT EXISTS guardrail_violations INTEGER DEFAULT 0;\" 2>&1 || sqlite3 \"$DB\" \"SELECT guardrail_violations FROM users LIMIT 1;\" 2>&1\nsqlite3 \"$DB\" \"ALTER TABLE users ADD COLUMN IF NOT EXISTS guardrail_blocked_until DATETIME;\" 2>&1 || true\necho \"=== Verifying columns ===\"\nsqlite3 \"$DB\" \"PRAGMA table_info(users);\" | grep -i guardrail || echo \"(guardrail columns not found)\"\necho \"=== Done ===\""')

        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 120 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 24); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/24] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo "=== OUTPUT ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
