name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.11'
  FLASK_ENV: testing
  TESTING: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8 black isort

      - name: Check formatting with Black
        run: black --check --diff . --exclude='/(\.git|venv|__pycache__|\.eggs)/'
        continue-on-error: true

      - name: Check import sorting with isort
        run: isort --check-only --diff . --skip venv --skip __pycache__
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,__pycache__,.git
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          # coverage 7.15.1 crashes generating the HTML report on traced Jinja
          # templates (SyntaxError in ast.parse); floor keeps it off runners
          pip install pytest pytest-cov pytest-xdist 'coverage>=7.15.2'

      - name: Run pytest with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          ANTHROPIC_API_KEY: test-api-key
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit bandit safety

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true

      - name: Run safety check
        run: safety check -r requirements.txt
        continue-on-error: true

      - name: Run bandit security linter
        run: bandit -r . -x ./tests,./venv -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 7
        if: always()

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Verify Flask app initialization
        env:
          SECRET_KEY: test-secret-key
          ANTHROPIC_API_KEY: test-api-key
        run: python -c "from app import app; print('Flask app initialized successfully')"

      - name: Check critical files exist
        run: |
          test -f requirements.txt || exit 1
          test -f app.py || exit 1
          test -f models.py || exit 1
          test -d templates || exit 1
          test -d services || exit 1
          test -d api || exit 1
          echo "All critical files and directories present"

      - name: Verify database models
        env:
          SECRET_KEY: test-secret-key
          ANTHROPIC_API_KEY: test-api-key
        run: python -c "from models import User, Conversation, APIKey, AuditLog; print('All models imported successfully')"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: devops-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    # Deliberately NOT in status-check's needs: a SonarCloud outage or an
    # unconfigured token must never block a deploy. Promote it by adding
    # `sonarcloud` to status-check's `needs` and its result check.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check whether SonarCloud is configured
        id: guard
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          # The token alone is not enough: sonar.organization has no default and
          # the scanner 403s without it. Checking only the token let a repo with
          # a token but no variables fail the job instead of skipping it.
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing SONAR_TOKEN(secret)"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing SONAR_ORGANIZATION(variable)"
          if [ -n "$missing" ]; then
            echo "SonarCloud is not configured - skipping analysis."
            echo "Missing:$missing"
            echo "See docs/sonarqube.md for one-time setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args="-Dsonar.organization=$SONAR_ORGANIZATION"
          # projectKey already has a value in sonar-project.properties; only
          # override it when the variable is set. Passing it unconditionally
          # sent an empty -Dsonar.projectKey= that clobbered that value.
          if [ -n "$SONAR_PROJECT_KEY" ]; then
            args="$args -Dsonar.projectKey=$SONAR_PROJECT_KEY"
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # The scanner's failure mode here is genuinely misleading: it reports
      #   "HTTP 403 ... Please check the property sonar.token or the
      #    environment variable SONAR_TOKEN"
      # for a missing organization as well as for a bad credential, and the
      # endpoint it fails on (api.sonarcloud.io/analysis/jres) answers 200
      # unauthenticated - so a 403 there means a token was sent and rejected.
      # This step isolates the credential from the configuration before the
      # scan runs. It prints only an HTTP status, never the token.
      - name: Verify the SonarCloud token
        if: steps.guard.outputs.configured == 'true'
        run: |
          url="https://sonarcloud.io/api/authentication/validate"
          code=$(curl -sS -o /tmp/sonar_validate.json -w '%{http_code}' -u "$SONAR_TOKEN:" "$url" || echo "000")

          if [ "$code" = "200" ] && grep -q '"valid":true' /tmp/sonar_validate.json; then
            echo "SONAR_TOKEN authenticates against SonarCloud."
            exit 0
          fi

          if [ "$code" = "200" ]; then
            # The endpoint answers 200 and puts the verdict in the body, so a
            # 200 here means SonarCloud looked the token up and rejected it,
            # not that the request failed. Reporting only the status code made
            # this read as a contradiction.
            echo "SonarCloud rejected the token: validate answered 200 with"
            echo '{"valid":false}. The token is not recognised by SonarCloud.'
          else
            echo "Could not reach SonarCloud to validate the token (HTTP $code)."
          fi

          echo
          echo "This is the credential, not the organization or project key."
          echo "Check, in order:"
          echo "  1. The secret is named exactly SONAR_TOKEN. GitHub cannot"
          echo "     rename a secret, so a token stored under any other name"
          echo "     is never read and fails exactly like an invalid one."
          echo "  2. It is a SonarCloud token, not a SonarQube Server one -"
          echo "     different products, tokens are not interchangeable."
          echo "  3. It has not been revoked or expired: regenerate at"
          echo "     https://sonarcloud.io -> My Account -> Security."
          echo "See docs/sonarqube.md."
          exit 1

      - name: Checkout code
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can attribute new code to commits, which
          # is what the Clean as You Code quality gate is measured against.
          fetch-depth: 0

      - name: Download coverage from the test job
        if: steps.guard.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud scan
        if: steps.guard.outputs.configured == 'true'
        # Pinned to a SHA, not a tag: GHSA-5xq9-5g24-4g6f was an argument
        # injection in this action itself (affects >=4.0.0, <6.0.0), and a
        # mutable tag is re-pointable by whoever controls the repository.
        # v8.2.1 - `args` and `projectBaseDir` are unchanged from v5, verified
        # against the v8.2.1 action.yml before bumping.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: ${{ steps.guard.outputs.args }}

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, security, build-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "security:    ${{ needs.security.result }}"
          echo "build-check: ${{ needs.build-check.result }}"
          if [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build-check.result }}" == "failure" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required CI/CD checks have passed successfully!"
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "NOTE: Lint/formatting check failed (non-blocking). Run: black . && isort . && flake8 . --select=E9,F63,F7,F82"
          fi

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [status-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize deploys so two overlapping runs can never race each other's
    # SSM script on the same box — see the reset target below for why this
    # matters together with pinning to a specific commit.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write   # OIDC token for AssumeRoleWithWebIdentity
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::188046727805:role/github-actions-deploy' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy via AWS SSM
        uses: nick-fields/retry@v3
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            cat > /tmp/deploy.sh << 'SCRIPT'
            #!/bin/bash
            set -e
            CODE=/var/www/devops-agent
            VENV=$CODE/venv

            echo "=== Pulling latest code ==="
            sudo -u ubuntu git -C "$CODE" remote set-url origin git@github.com:shittuay/DevOps-Agent.git
            sudo -u ubuntu git -C "$CODE" config core.sshCommand "ssh -i /home/ubuntu/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            sudo -u ubuntu git -C "$CODE" fetch origin main
            # Reset to the exact commit THIS workflow run tested (github.sha),
            # never "origin/main" (its current tip). A prior incident: this
            # step used to reset to origin/main, so a deploy job that started
            # before a later, failing push landed could still finish its git
            # reset/fetch after that push arrived and deploy the untested,
            # broken tip anyway — the failing push's own CI correctly failed
            # and skipped ITS deploy, but a different, already-green run's
            # deploy raced past it and shipped it regardless. Pinning to the
            # SHA this run actually built/tested closes that race; the
            # concurrency group above stops two deploy runs from overlapping
            # in the first place.
            echo "Deploying tested commit: ${{ github.sha }}"
            sudo -u ubuntu git -C "$CODE" reset --hard ${{ github.sha }}
            echo "Deployed: $(sudo -u ubuntu git -C $CODE rev-parse --short HEAD)"

            echo "=== Installing dependencies ==="
            sudo -u ubuntu "$VENV/bin/pip" install -r "$CODE/requirements.txt" -q

            echo "=== Restarting service ==="
            systemctl restart devops-agent
            sleep 4
            systemctl is-active devops-agent

            echo "=== Health check ==="
            curl -sf http://localhost:8000/health && echo "HEALTH: OK" || { echo "HEALTH: FAIL"; exit 1; }
            echo "=== Deploy complete ==="
            SCRIPT

            CMD=$(jq -Rs . /tmp/deploy.sh)

            COMMAND_ID=$(aws ssm send-command \
              --instance-id "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 300 \
              --parameters "{\"commands\":[$CMD]}" \
              --output text --query "Command.CommandId")

            echo "SSM Command ID: $COMMAND_ID"

            for i in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "[$i/60] $STATUS"
              case "$STATUS" in
                Success) break ;;
                Failed|Cancelled|TimedOut)
                  echo "=== Error output ==="
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardErrorContent" --output text
                  exit 1 ;;
              esac
              sleep 5
            done

            echo "=== Deploy output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text

            [ "$STATUS" = "Success" ] || { echo "Timed out waiting for deploy"; exit 1; }
