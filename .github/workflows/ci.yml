name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.11'
  FLASK_ENV: testing
  TESTING: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8 black isort

      - name: Check formatting with Black
        run: black --check --diff . --exclude='/(\.git|venv|__pycache__|\.eggs)/'
        continue-on-error: true

      - name: Check import sorting with isort
        run: isort --check-only --diff . --skip venv --skip __pycache__
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,__pycache__,.git
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          # coverage 7.15.1 crashes generating the HTML report on traced Jinja
          # templates (SyntaxError in ast.parse); floor keeps it off runners
          pip install pytest pytest-cov pytest-xdist 'coverage>=7.15.2'

      - name: Run pytest with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          ANTHROPIC_API_KEY: test-api-key
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit bandit safety

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true

      - name: Run safety check
        run: safety check -r requirements.txt
        continue-on-error: true

      - name: Run bandit security linter
        run: bandit -r . -x ./tests,./venv -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 7
        if: always()

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Verify Flask app initialization
        env:
          SECRET_KEY: test-secret-key
          ANTHROPIC_API_KEY: test-api-key
        run: python -c "from app import app; print('Flask app initialized successfully')"

      - name: Check critical files exist
        run: |
          test -f requirements.txt || exit 1
          test -f app.py || exit 1
          test -f models.py || exit 1
          test -d templates || exit 1
          test -d services || exit 1
          test -d api || exit 1
          echo "All critical files and directories present"

      - name: Verify database models
        env:
          SECRET_KEY: test-secret-key
          ANTHROPIC_API_KEY: test-api-key
        run: python -c "from models import User, Conversation, APIKey, AuditLog; print('All models imported successfully')"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: devops-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, security, build-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "security:    ${{ needs.security.result }}"
          echo "build-check: ${{ needs.build-check.result }}"
          if [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build-check.result }}" == "failure" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required CI/CD checks have passed successfully!"
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "NOTE: Lint/formatting check failed (non-blocking). Run: black . && isort . && flake8 . --select=E9,F63,F7,F82"
          fi

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [status-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via AWS SSM
        uses: nick-fields/retry@v3
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            cat > /tmp/deploy.sh << 'SCRIPT'
            #!/bin/bash
            set -e
            CODE=/var/www/devops-agent
            VENV=$CODE/venv

            echo "=== Pulling latest code ==="
            sudo -u ubuntu git -C "$CODE" remote set-url origin git@github.com:shittuay/DevOps-Agent.git
            sudo -u ubuntu git -C "$CODE" config core.sshCommand "ssh -i /home/ubuntu/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            sudo -u ubuntu git -C "$CODE" fetch origin main
            sudo -u ubuntu git -C "$CODE" reset --hard origin/main
            echo "Deployed: $(sudo -u ubuntu git -C $CODE rev-parse --short HEAD)"

            echo "=== Installing dependencies ==="
            sudo -u ubuntu "$VENV/bin/pip" install -r "$CODE/requirements.txt" -q

            echo "=== Restarting service ==="
            systemctl restart devops-agent
            sleep 4
            systemctl is-active devops-agent

            echo "=== Health check ==="
            curl -sf http://localhost:8000/health && echo "HEALTH: OK" || { echo "HEALTH: FAIL"; exit 1; }
            echo "=== Deploy complete ==="
            SCRIPT

            CMD=$(jq -Rs . /tmp/deploy.sh)

            COMMAND_ID=$(aws ssm send-command \
              --instance-id "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 300 \
              --parameters "{\"commands\":[$CMD]}" \
              --output text --query "Command.CommandId")

            echo "SSM Command ID: $COMMAND_ID"

            for i in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "[$i/60] $STATUS"
              case "$STATUS" in
                Success) break ;;
                Failed|Cancelled|TimedOut)
                  echo "=== Error output ==="
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardErrorContent" --output text
                  exit 1 ;;
              esac
              sleep 5
            done

            echo "=== Deploy output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text

            [ "$STATUS" = "Success" ] || { echo "Timed out waiting for deploy"; exit 1; }
