name: Check Production Errors

on:
  workflow_dispatch:

jobs:
  check-errors:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for AssumeRoleWithWebIdentity
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::188046727805:role/github-actions-deploy
        aws-region: us-east-1

    - name: Query errors via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        cat > /tmp/check.sh << 'SCRIPT'
        #!/bin/bash
        CODE=/var/www/devops-agent
        VENV=/var/www/devops-agent/venv
        # Locate DB: check .env first, then search common paths
        export DB_URL=$(grep -E '^DATABASE_URL' $CODE/.env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
        if echo "$DB_URL" | grep -q 'sqlite:///'; then
          REL=${DB_URL#sqlite:///}
          DB="$CODE/$REL"
        else
          DB=$(find /home/ubuntu /var/www -name "*.db" 2>/dev/null | head -1)
        fi
        # VENV has no fallback like DB does above, so a wrong path here fails
        # silently (sudo/python errors go to stderr, which this report doesn't
        # capture) instead of erroring loudly - search for it if the primary
        # path is missing so a future layout change can't reintroduce this.
        if [ ! -x "$VENV/bin/python3" ]; then
          FOUND_VENV=$(find /home/ubuntu /var/www -maxdepth 3 -type f -name python3 -path '*/venv/bin/*' 2>/dev/null | head -1)
          if [ -n "$FOUND_VENV" ]; then
            VENV=$(dirname "$(dirname "$FOUND_VENV")")
          fi
        fi

        echo "========================================"
        echo "DB path: $DB"
        echo "DB_URL: $DB_URL"
        echo "VENV path: $VENV"
        echo "========================================"

        # gunicorn is started with --error-logfile /var/log/devops-agent-error.log and
        # --access-logfile /var/log/devops-agent-access.log (devops-agent.service), so
        # the app's own log lines never reach journald — every journalctl section this
        # workflow used to have reported "-- No entries --" while the box was busy.
        ERRLOG=/var/log/devops-agent-error.log
        ACCLOG=/var/log/devops-agent-access.log

        echo ""
        echo "=== APP ERRORS / TRACEBACKS (gunicorn error log, last 24h) ==="
        if [ -f "$ERRLOG" ]; then
          grep -iE "error|exception|traceback|critical" "$ERRLOG" | tail -60 || echo "(none)"
        else
          echo "(no $ERRLOG)"
        fi

        echo ""
        echo "=== APP WARNINGS (gunicorn error log, sample) ==="
        if [ -f "$ERRLOG" ]; then
          grep -iE "warning" "$ERRLOG" | tail -30 || echo "(none)"
        fi

        echo ""
        echo "=== AGENT TURN SIGNALS (gunicorn error log, last 80 matching lines) ==="
        # Provider selection, swarm sizing, tool calls, token usage — the lines that
        # say what the agent actually did on each turn.
        if [ -f "$ERRLOG" ]; then
          grep -E "Swarm:|tool call:|usage:|Guardrail|Kimi|Claude|Selected [0-9]+ tools|tool_selection|APPROVAL|still_running|keep-alive|CHAT_MAX_TURN" "$ERRLOG" | tail -80 || echo "(none)"
        fi

        echo ""
        echo "=== RECENT ERROR LOG (all levels, last 40 lines) ==="
        [ -f "$ERRLOG" ] && tail -40 "$ERRLOG" || echo "(none)"

        echo ""
        echo "=== CHAT REQUESTS (access log, last 40 /api/chat lines) ==="
        [ -f "$ACCLOG" ] && grep -E "/api/chat|/api/agent|/v1/agent" "$ACCLOG" | tail -40 || echo "(none)"

        echo ""
        echo "=== SLACK / NOTIFICATION LOGS (error log) ==="
        [ -f "$ERRLOG" ] && grep -i "slack\|notification\|webhook" "$ERRLOG" | tail -20 || echo "(none)"

        echo ""
        echo "=== RECENT AGENT TURNS (usage_logs, last 7 days, newest first) ==="
        # The non-streaming /api/chat path (Kimi tiers) never writes chat_messages.tool_trace,
        # so the tool-call counter below is blind to it; usage_logs.tool_name is written
        # by _finalize_turn for every path.
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os
        db_url = os.environ.get('DB_URL', '')
        sql = """
            SELECT created_at, user_id, action_type, tool_name, ai_model, success,
                   COALESCE(LEFT(error_message, 120), '')
            FROM usage_logs
            WHERE created_at >= NOW() - INTERVAL '7 days'
            ORDER BY created_at DESC LIMIT 40
        """
        try:
            if db_url.startswith('postgres'):
                import psycopg2
                pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
                con = psycopg2.connect(pg_url)
                cur = con.cursor()
                cur.execute(sql)
                rows = cur.fetchall()
            else:
                import sqlite3
                con = sqlite3.connect(sys.argv[1])
                rows = con.execute(sql.replace("NOW() - INTERVAL '7 days'", "datetime('now','-7 days')")
                                      .replace("LEFT(error_message, 120)", "substr(error_message,1,120)")).fetchall()
            if not rows:
                print("No usage_logs rows in the last 7 days.")
            for r in rows:
                print("  " + " | ".join(str(x) for x in r))
            con.close()
        except Exception as e:
            print(f"Query error: {e}")
        PYEOF

        echo ""
        echo "=== RECENT ASSISTANT REPLIES (chat_messages, last 7 days, metadata + first 160 chars) ==="
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os
        db_url = os.environ.get('DB_URL', '')
        sql = """
            SELECT timestamp, conversation_id, role, LENGTH(content), LEFT(content, 160)
            FROM chat_messages
            WHERE timestamp >= NOW() - INTERVAL '7 days'
            ORDER BY timestamp DESC LIMIT 30
        """
        try:
            if db_url.startswith('postgres'):
                import psycopg2
                pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
                con = psycopg2.connect(pg_url)
                cur = con.cursor()
                cur.execute(sql)
                rows = cur.fetchall()
            else:
                import sqlite3
                con = sqlite3.connect(sys.argv[1])
                rows = con.execute(sql.replace("NOW() - INTERVAL '7 days'", "datetime('now','-7 days')")
                                      .replace("LEFT(content, 160)", "substr(content,1,160)")).fetchall()
            if not rows:
                print("No chat_messages rows in the last 7 days.")
            for ts, cid, role, n, head in rows:
                head = (head or '').replace('\n', ' ')
                print(f"  {ts} | conv={cid} | {role} | {n} chars | {head}")
            con.close()
        except Exception as e:
            print(f"Query error: {e}")
        PYEOF

        echo ""
        echo "=== TOOL CALL FAILURES (last 7 days) ==="
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os, json
        from collections import Counter
        db_url = os.environ.get('DB_URL', '')
        if db_url.startswith('postgres'):
            import psycopg2
            pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
            con = psycopg2.connect(pg_url)
            cur = con.cursor()
            cur.execute("""
                SELECT tool_trace FROM chat_messages
                WHERE tool_trace IS NOT NULL
                  AND timestamp >= NOW() - INTERVAL '7 days'
            """)
            rows = cur.fetchall()
        else:
            import sqlite3
            con = sqlite3.connect(sys.argv[1])
            rows = con.execute("""
                SELECT tool_trace FROM chat_messages
                WHERE tool_trace IS NOT NULL
                  AND timestamp >= datetime('now','-7 days')
            """).fetchall()
        failures = Counter()
        total_calls = 0
        for (trace,) in rows:
            try:
                entries = json.loads(trace) if isinstance(trace, str) else trace
                if not isinstance(entries, list):
                    continue
                for e in entries:
                    total_calls += 1
                    if not e.get('success', True):
                        failures[e.get('tool', 'unknown')] += 1
            except Exception:
                pass
        print(f"Total tool calls: {total_calls}")
        print(f"Failed tool calls: {sum(failures.values())}")
        if failures:
            print("Failures by tool:")
            for tool, count in failures.most_common(15):
                print(f"  {tool}: {count}")
        else:
            print("No tool failures found.")
        con.close()
        PYEOF

        echo ""
        echo "=== GUARDRAIL VIOLATIONS ==="
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os
        db_url = os.environ.get('DB_URL', '')
        try:
            if db_url.startswith('postgres'):
                import psycopg2
                pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
                con = psycopg2.connect(pg_url)
                cur = con.cursor()
                cur.execute("""
                    SELECT email, guardrail_violations, guardrail_blocked_until
                    FROM users
                    WHERE guardrail_violations > 0
                    ORDER BY guardrail_violations DESC
                """)
                rows = cur.fetchall()
            else:
                import sqlite3
                con = sqlite3.connect(sys.argv[1])
                rows = con.execute("""
                    SELECT email, guardrail_violations, guardrail_blocked_until
                    FROM users
                    WHERE guardrail_violations > 0
                    ORDER BY guardrail_violations DESC
                """).fetchall()
            if rows:
                print(f"Users with violations: {len(rows)}")
                for email, v, blocked in rows:
                    print(f"  {email}: {v} violations, blocked_until={blocked}")
            else:
                print("No guardrail violations.")
        except Exception as e:
            print(f"Query error: {e}")
        con.close()
        PYEOF

        echo ""
        echo "=== ERROR PATTERNS IN ASSISTANT MESSAGES (last 7 days) ==="
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os
        from collections import Counter
        db_url = os.environ.get('DB_URL', '')
        if db_url.startswith('postgres'):
            import psycopg2
            pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
            con = psycopg2.connect(pg_url)
            cur = con.cursor()
            cur.execute("""
                SELECT content FROM chat_messages
                WHERE role='assistant'
                  AND timestamp >= NOW() - INTERVAL '7 days'
                  AND (
                    content ILIKE '%error%' OR
                    content ILIKE '%failed%' OR
                    content ILIKE '%unavailable%' OR
                    content ILIKE '%I cannot%' OR
                    content ILIKE '%rate limit%' OR
                    content ILIKE '%API error%'
                  )
            """)
            rows = cur.fetchall()
        else:
            import sqlite3
            con = sqlite3.connect(sys.argv[1])
            rows = con.execute("""
                SELECT content FROM chat_messages
                WHERE role='assistant'
                  AND timestamp >= datetime('now','-7 days')
                  AND (
                    content LIKE '%error%' OR
                    content LIKE '%failed%' OR
                    content LIKE '%unavailable%' OR
                    content LIKE '%I cannot%' OR
                    content LIKE '%rate limit%' OR
                    content LIKE '%API error%'
                  )
            """).fetchall()
        patterns = Counter()
        for (content,) in rows:
            c = content.lower()
            if 'rate limit' in c:       patterns['rate_limit'] += 1
            if 'api error' in c:        patterns['api_error'] += 1
            if 'unavailable' in c:      patterns['service_unavailable'] += 1
            if 'i cannot' in c:         patterns['refused'] += 1
            if 'failed' in c:           patterns['failed'] += 1
            if 'error' in c:            patterns['error_mentioned'] += 1
        print(f"Flagged messages: {len(rows)}")
        for k, v in patterns.most_common():
            print(f"  {k}: {v}")
        con.close()
        PYEOF

        echo ""
        echo "=== OVERALL USAGE (last 7 days) ==="
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os
        db_url = os.environ.get('DB_URL', '')
        if db_url.startswith('postgres'):
            import psycopg2
            pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
            con = psycopg2.connect(pg_url)
            cur = con.cursor()
            def one(sql):
                cur.execute(sql)
                return cur.fetchone()[0]
            users    = one("SELECT COUNT(*) FROM users")
            convs    = one("SELECT COUNT(*) FROM conversations WHERE created_at >= NOW() - INTERVAL '7 days'")
            msgs     = one("SELECT COUNT(*) FROM chat_messages WHERE timestamp >= NOW() - INTERVAL '7 days'")
            usr_msgs = one("SELECT COUNT(*) FROM chat_messages WHERE role='user' AND timestamp >= NOW() - INTERVAL '7 days'")
        else:
            import sqlite3
            con = sqlite3.connect(sys.argv[1])
            users    = con.execute("SELECT COUNT(*) FROM users").fetchone()[0]
            convs    = con.execute("SELECT COUNT(*) FROM conversations WHERE created_at >= datetime('now','-7 days')").fetchone()[0]
            msgs     = con.execute("SELECT COUNT(*) FROM chat_messages WHERE timestamp >= datetime('now','-7 days')").fetchone()[0]
            usr_msgs = con.execute("SELECT COUNT(*) FROM chat_messages WHERE role='user' AND timestamp >= datetime('now','-7 days')").fetchone()[0]
        print(f"Total users: {users}")
        print(f"New conversations (7d): {convs}")
        print(f"Total messages (7d): {msgs}  (user: {usr_msgs}, assistant: {msgs - usr_msgs})")
        con.close()
        PYEOF

        echo ""
        echo "=== SUBSCRIPTION / CREDITS SNAPSHOT (per user) ==="
        # For diagnosing "the app shows N credits but the chat says 0" reports:
        # credits_remaining/used are the live DB values CreditService.balance()
        # and the /chat page render both read directly, with no caching layer
        # in between — a mismatch the user sees is a real state difference,
        # not a stale display, unless the two reads happen far enough apart
        # for real usage to land between them.
        "$VENV/bin/python3" - "$DB" << 'PYEOF' 2>&1
        import sys, os
        db_url = os.environ.get('DB_URL', '')
        try:
            if db_url.startswith('postgres'):
                import psycopg2
                pg_url = 'postgresql://' + db_url.split('://', 1)[1] if db_url.startswith('postgresql+') else db_url
                con = psycopg2.connect(pg_url)
                cur = con.cursor()
                cur.execute("""
                    SELECT u.email, t.name, s.credits_remaining, s.credits_used_this_month,
                           s.total_credits_used, s.last_reset_date, s.current_period_end,
                           s.payment_status
                    FROM user_subscriptions s
                    JOIN users u ON u.id = s.user_id
                    JOIN subscription_tiers t ON t.id = s.tier_id
                    ORDER BY s.updated_at DESC
                """)
                rows = cur.fetchall()
            else:
                import sqlite3
                con = sqlite3.connect(sys.argv[1])
                rows = con.execute("""
                    SELECT u.email, t.name, s.credits_remaining, s.credits_used_this_month,
                           s.total_credits_used, s.last_reset_date, s.current_period_end,
                           s.payment_status
                    FROM user_subscriptions s
                    JOIN users u ON u.id = s.user_id
                    JOIN subscription_tiers t ON t.id = s.tier_id
                    ORDER BY s.updated_at DESC
                """).fetchall()
            if not rows:
                print("No subscription rows found.")
            for email, tier, remaining, used_month, used_total, reset, period_end, pay_status in rows:
                print(f"  {email} | tier={tier} | remaining={remaining} | used_this_month={used_month} "
                      f"| used_total={used_total} | last_reset={reset} | period_end={period_end} "
                      f"| payment_status={pay_status}")
            con.close()
        except Exception as e:
            print(f"Query error: {e}")
        PYEOF

        echo ""
        echo "=== DONE ==="
        SCRIPT

        CMD=$(jq -Rs . /tmp/check.sh)

        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 120 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/30] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        echo ""
        echo "=== OUTPUT ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out"; exit 1; }
