name: Server Python Upgrade

# Manual only. Moves the production venv from the server's system Python (3.10) to
# Python 3.11, with an instant rollback. Run "inspect" first; it changes nothing.
#
# Layout after "upgrade":
#   /var/www/devops-agent/venv      -> symlink to venv-py311
#   /var/www/devops-agent/venv-py311  new venv (its scripts' shebangs name this path)
#   /var/www/devops-agent/venv-py310  the old venv, renamed. Its shebangs still name
#                                     .../venv/bin/python3, which resolves through the
#                                     symlink, so pointing the symlink back is a rollback.
# The systemd unit and the deploy job keep using .../venv, so neither needs changing.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect (read-only), upgrade, or rollback"
        required: true
        default: inspect
        type: choice
        options: [inspect, upgrade, rollback]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  server-python:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::188046727805:role/github-actions-deploy' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run on the server via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          cat > /tmp/script.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          MODE="__MODE__"
          CODE=/var/www/devops-agent
          NEW=$CODE/venv-py311
          OLD=$CODE/venv-py310

          health() {
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null; then echo "HEALTH: OK"; return 0; fi
              sleep 3
            done
            echo "HEALTH: FAIL"; return 1
          }

          echo "=== Server ==="
          . /etc/os-release; echo "OS: $PRETTY_NAME"
          echo "System python3: $(python3 --version 2>&1)"
          echo "python3.11: $(command -v python3.11 && python3.11 --version 2>&1 || echo 'not installed')"
          echo "venv: $(ls -ld $CODE/venv | cut -c1) $(readlink $CODE/venv || echo '(directory)')"
          echo "venv python: $($CODE/venv/bin/python --version 2>&1)"
          echo "Disk free: $(df -h $CODE | awk 'NR==2{print $4}')"
          echo "Service: $(systemctl is-active devops-agent)"

          if [ "$MODE" = inspect ]; then exit 0; fi

          if [ "$MODE" = rollback ]; then
            [ -d "$OLD" ] || { echo "No $OLD to roll back to"; exit 1; }
            ln -sfn "$OLD" "$CODE/venv.tmp" && mv -T "$CODE/venv.tmp" "$CODE/venv"
            chown -h ubuntu:ubuntu "$CODE/venv"
            systemctl restart devops-agent
            health
            echo "Rolled back to: $($CODE/venv/bin/python --version 2>&1)"
            exit 0
          fi

          # ---- upgrade ----
          if [ -L "$CODE/venv" ] && [ "$(readlink $CODE/venv)" = "$NEW" ]; then
            echo "Already on $NEW"; exit 0
          fi

          echo "=== Installing Python 3.11 ==="
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v python3.11 > /dev/null; then
            apt-get update -q
            if ! apt-cache show python3.11-venv > /dev/null 2>&1; then
              apt-get install -y -q software-properties-common
              add-apt-repository -y ppa:deadsnakes/ppa
              apt-get update -q
            fi
          fi
          apt-get install -y -q python3.11 python3.11-venv python3.11-dev build-essential libpq-dev
          python3.11 --version

          echo "=== Building $NEW ==="
          rm -rf "$NEW"
          sudo -u ubuntu python3.11 -m venv "$NEW"
          sudo -u ubuntu "$NEW/bin/pip" install -q --upgrade pip
          sudo -u ubuntu "$NEW/bin/pip" install -q -r "$CODE/requirements.txt"
          sudo -u ubuntu "$NEW/bin/pip" check
          # Compiled dependencies load on 3.11. The full app is proven by the health check
          # after switching, which rolls back automatically if it fails.
          sudo -u ubuntu "$NEW/bin/python" -c "import flask, sqlalchemy, psycopg2, PIL, cryptography, boto3, anthropic, openai, gunicorn"
          echo "Imports OK on $($NEW/bin/python --version)"

          echo "=== Switching ==="
          if [ ! -L "$CODE/venv" ]; then
            [ ! -e "$OLD" ] || { echo "$OLD already exists, refusing to overwrite"; exit 1; }
            mv "$CODE/venv" "$OLD"
          fi
          ln -sfn "$NEW" "$CODE/venv.tmp" && mv -T "$CODE/venv.tmp" "$CODE/venv"
          chown -h ubuntu:ubuntu "$CODE/venv"
          systemctl restart devops-agent

          if ! health; then
            echo "=== New venv unhealthy, rolling back ==="
            journalctl -u devops-agent -n 40 --no-pager || true
            ln -sfn "$OLD" "$CODE/venv.tmp" && mv -T "$CODE/venv.tmp" "$CODE/venv"
            systemctl restart devops-agent
            health || true
            exit 1
          fi
          echo "Now running: $($CODE/venv/bin/python --version 2>&1)"
          echo "Old venv kept at $OLD for rollback."
          SCRIPT

          sed -i "s/__MODE__/$MODE/" /tmp/script.sh
          CMD=$(jq -Rs . /tmp/script.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-id "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --parameters "{\"commands\":[$CMD],\"executionTimeout\":[\"1800\"]}" \
            --output text --query "Command.CommandId")
          echo "SSM Command ID: $COMMAND_ID"

          STATUS=Pending
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          echo "Status: $STATUS"
          echo "=== Output ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "=== Errors ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          [ "$STATUS" = Success ]
