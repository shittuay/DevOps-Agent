name: Scheduled Security Scan

# Routine vulnerability scan. Runs daily on a cron schedule (independent of
# pushes/PRs) and can also be triggered manually via the Actions tab.
on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit bandit safety

      - name: Run pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true

      - name: Run safety check (dependency CVEs)
        run: safety check -r requirements.txt
        continue-on-error: true

      - name: Run bandit (source security linter)
        run: bandit -r . -x ./tests,./venv -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-bandit-report
          path: bandit-report.json
          retention-days: 30
        if: always()
