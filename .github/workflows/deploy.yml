name: Deploy to Ubuntu Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        command_timeout: 10m
        script: |
          set -e

          echo "=== DevOps Agent Deployment ==="

          APP_DIR="/home/ubuntu/app"
          CODE_DIR="$APP_DIR/DevOps-Agent"
          VENV_DIR="$APP_DIR/venv"

          mkdir -p "$APP_DIR"

          # ============================================
          # STEP 1: Stop old processes and clean up PM2
          # ============================================
          echo "[1/7] Stopping old processes..."

          # Disable PM2 systemd startup service (prevents PM2 from resurrecting old processes)
          sudo systemctl stop pm2-ubuntu 2>/dev/null || true
          sudo systemctl disable pm2-ubuntu 2>/dev/null || true
          sudo systemctl stop pm2-root 2>/dev/null || true
          sudo systemctl disable pm2-root 2>/dev/null || true

          # Stop our systemd service if it exists from a previous deploy
          sudo systemctl stop devops-agent 2>/dev/null || true

          # Clean up PM2 completely
          rm -f /home/ubuntu/.pm2/dump.pm2 2>/dev/null || true
          pm2 stop all 2>/dev/null || true
          pm2 delete all 2>/dev/null || true
          pm2 kill 2>/dev/null || true

          # Kill anything still on port 5000
          sudo fuser -k 5000/tcp 2>/dev/null || true
          sleep 2

          # Verify port is free
          if sudo fuser 5000/tcp 2>/dev/null; then
            echo "WARNING: Port 5000 still in use!"
            sudo fuser -v 5000/tcp || true
          else
            echo "Port 5000 is free."
          fi

          # ============================================
          # STEP 2: Clone fresh code
          # ============================================
          echo "[2/7] Cloning latest code..."
          cd "$APP_DIR"
          rm -rf DevOps-Agent
          git clone https://github.com/shittuay/DevOps-Agent.git
          cd DevOps-Agent
          echo "Cloned commit: $(git rev-parse --short HEAD)"

          # ============================================
          # STEP 3: Set up Python virtual environment
          # ============================================
          echo "[3/7] Setting up Python environment..."
          python3 -m venv "$VENV_DIR" 2>/dev/null || true
          source "$VENV_DIR/bin/activate"
          pip install --upgrade pip -q
          pip install -r requirements.txt -q

          # ============================================
          # STEP 4: Configure environment
          # ============================================
          echo "[4/7] Configuring environment..."
          mkdir -p logs instance config "$APP_DIR/data"

          # .env fallback (in case AWS Secrets Manager fails)
          printf '%s\n' \
            'FLASK_ENV=production' \
            'USE_AWS_SECRETS=true' \
            'AWS_DEFAULT_REGION=us-east-1' \
            'BASE_URL=https://devopsagent.io' \
            'PORT=5000' \
            'HOST=0.0.0.0' \
            'LOG_LEVEL=INFO' \
            > config/.env

          # ============================================
          # STEP 5: Initialize PostgreSQL database
          # ============================================
          echo "[5/7] Initializing database..."

          # Ensure PostgreSQL is installed and running
          if ! command -v psql &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql postgresql-contrib
          fi
          sudo systemctl start postgresql
          sudo systemctl enable postgresql

          # Create database user and database if they don't exist
          # Password is managed via AWS Secrets Manager (DATABASE_URL), not hardcoded
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='devopsagent'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE USER devopsagent WITH PASSWORD '${{ secrets.DB_PASSWORD }}';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='devops_agent'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE DATABASE devops_agent OWNER devopsagent;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE devops_agent TO devopsagent;"

          # Create any new tables without dropping existing ones (preserves user data)
          # db.create_all() is safe: it only creates tables that don't already exist
          echo "Creating any new tables (preserving existing data)..."
          sudo -u postgres psql -d devops_agent -c "GRANT ALL ON SCHEMA public TO devopsagent; GRANT ALL ON SCHEMA public TO public;"
          FLASK_ENV=production USE_AWS_SECRETS=true AWS_DEFAULT_REGION=us-east-1 \
            python -c "from app import app, db; app.app_context().push(); db.create_all(); print('Tables synced (existing data preserved)')"

          # ============================================
          # STEP 5b: Create Stripe prices and update AWS Secrets Manager (one-time)
          # ============================================
          echo "[5b] Creating Stripe prices..."
          FLASK_ENV=production USE_AWS_SECRETS=true AWS_DEFAULT_REGION=us-east-1 \
            python -c "import os,sys; sys.path.insert(0,'.'); from services.secrets_manager import init_secrets; init_secrets()" 2>/dev/null || true
          FLASK_ENV=production USE_AWS_SECRETS=true AWS_DEFAULT_REGION=us-east-1 \
            python scripts/create_stripe_prices.py || echo "Stripe price creation failed (may already exist)"

          # ============================================
          # STEP 6: Create and start systemd service
          # ============================================
          echo "[6/7] Setting up systemd service..."
          sudo tee /etc/systemd/system/devops-agent.service > /dev/null << SVCEOF
          [Unit]
          Description=DevOps Agent Flask Application
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=$CODE_DIR
          Environment=FLASK_ENV=production
          Environment=USE_AWS_SECRETS=true
          Environment=AWS_DEFAULT_REGION=us-east-1
          Environment=BASE_URL=https://devopsagent.io
          Environment=PORT=5000
          Environment=HOST=0.0.0.0
          ExecStart=$VENV_DIR/bin/python app.py
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:$CODE_DIR/logs/app.log
          StandardError=append:$CODE_DIR/logs/app-error.log

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # Strip leading whitespace from YAML heredoc indentation
          sudo sed -i 's/^[[:space:]]*//' /etc/systemd/system/devops-agent.service

          sudo systemctl daemon-reload
          sudo systemctl enable devops-agent
          sudo systemctl restart devops-agent

          # ============================================
          # STEP 7: Configure nginx reverse proxy
          # ============================================
          echo "[7/8] Configuring nginx..."

          # Install nginx if not present
          if ! command -v nginx &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y nginx
          fi

          # Debug: show existing nginx site configs and SSL certs
          echo "=== Existing site configs ==="
          ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
          ls -la /etc/nginx/conf.d/ 2>/dev/null || true
          echo "=== SSL cert search ==="
          sudo find /etc/letsencrypt/live/ -name "*.pem" 2>/dev/null || echo "No letsencrypt certs"
          sudo find /etc/ssl/ -name "*.pem" -newer /etc/ssl/openssl.cnf 2>/dev/null | head -10 || true
          echo "=== Listening ports ==="
          sudo ss -tlnp | grep -E ':80|:443|:5000' || true

          # Find SSL certs - check multiple possible paths
          SSL_CERT=""
          SSL_KEY=""
          for DOMAIN in devopsagent.io www.devopsagent.io; do
            if [ -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              SSL_CERT="/etc/letsencrypt/live/$DOMAIN/fullchain.pem"
              SSL_KEY="/etc/letsencrypt/live/$DOMAIN/privkey.pem"
              echo "Found SSL certs for $DOMAIN"
              break
            fi
          done

          # Also check if certs are in a different letsencrypt directory name
          if [ -z "$SSL_CERT" ]; then
            CERT_DIR=$(sudo find /etc/letsencrypt/live/ -name "fullchain.pem" 2>/dev/null | head -1)
            if [ -n "$CERT_DIR" ]; then
              SSL_CERT="$CERT_DIR"
              SSL_KEY="$(dirname "$CERT_DIR")/privkey.pem"
              echo "Found SSL certs at $SSL_CERT"
            fi
          fi

          # Create nginx config
          if [ -n "$SSL_CERT" ]; then
            echo "Using HTTPS config with SSL cert: $SSL_CERT"
            sudo tee /etc/nginx/sites-available/devops-agent > /dev/null << NGEOF
          server {
              listen 80;
              server_name devopsagent.io www.devopsagent.io;
              return 301 https://\$host\$request_uri;
          }

          server {
              listen 443 ssl;
              server_name devopsagent.io www.devopsagent.io;

              ssl_certificate $SSL_CERT;
              ssl_certificate_key $SSL_KEY;
              ssl_protocols TLSv1.2 TLSv1.3;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 75s;
              }
          }
          NGEOF
          else
            echo "No SSL certs found - using HTTP-only config on port 80"
            sudo tee /etc/nginx/sites-available/devops-agent > /dev/null << 'NGEOF'
          server {
              listen 80;
              server_name devopsagent.io www.devopsagent.io _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 75s;
              }
          }
          NGEOF
          fi

          # Strip leading whitespace from YAML heredoc
          sudo sed -i 's/^[[:space:]]*//' /etc/nginx/sites-available/devops-agent

          # Enable the site
          sudo ln -sf /etc/nginx/sites-available/devops-agent /etc/nginx/sites-enabled/devops-agent
          sudo rm -f /etc/nginx/sites-enabled/default

          # Test and reload nginx
          echo "=== Final nginx config ==="
          cat /etc/nginx/sites-available/devops-agent
          echo "=== Testing nginx ==="
          sudo nginx -t
          sudo systemctl reload nginx
          echo "=== Nginx status ==="
          sudo systemctl status nginx --no-pager -l || true

          # ============================================
          # STEP 8: Verify deployment
          # ============================================
          echo "[8/8] Verifying deployment..."
          sleep 5

          echo "=== Service Status ==="
          sudo systemctl status devops-agent --no-pager -l || true

          echo ""
          echo "=== Health Check (direct) ==="
          curl -s http://localhost:5000/health || echo "Direct health check failed!"

          echo ""
          echo "=== Health Check (via nginx) ==="
          curl -s http://localhost/health || echo "Nginx health check failed!"

          echo ""
          echo "=== Recent Logs ==="
          tail -20 "$CODE_DIR/logs/app.log" 2>/dev/null || true
          tail -10 "$CODE_DIR/logs/app-error.log" 2>/dev/null || true

          echo ""
          echo "=== Deployment Complete ==="
          echo "App: https://devopsagent.io"
