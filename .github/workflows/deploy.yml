name: Deploy to Ubuntu Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prerequisites (one-time setup):
#   1. Add GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, EC2_INSTANCE_ID
#   2. EC2 instance must have an IAM role with AmazonSSMManagedInstanceCore policy
#   3. SSM Agent must be running on EC2 (pre-installed on Ubuntu 20.04+ AWS AMIs)
#      Check: sudo systemctl status snap.amazon-ssm-agent.amazon-ssm-agent
#      Start:  sudo systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy via AWS SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        # Write the deploy script to a temp file
        cat > /tmp/deploy.sh << 'SCRIPT'
        #!/bin/bash
        set -e
        APP=/home/ubuntu/app
        CODE=$APP/DevOps-Agent
        VENV=$APP/venv

        echo "=== Pulling latest code ==="
        sudo -u ubuntu git -C "$CODE" fetch origin main
        sudo -u ubuntu git -C "$CODE" reset --hard origin/main
        echo "Deployed: $(sudo -u ubuntu git -C $CODE rev-parse --short HEAD)"

        echo "=== Installing dependencies ==="
        sudo -u ubuntu "$VENV/bin/pip" install -r "$CODE/requirements.txt" -q

        echo "=== Restarting service ==="
        systemctl restart devops-agent
        sleep 4
        systemctl is-active devops-agent

        echo "=== Health check ==="
        curl -sf http://localhost:5000/health && echo "HEALTH: OK" || { echo "HEALTH: FAIL"; exit 1; }
        echo "=== Deploy complete ==="
        SCRIPT

        # Encode script as JSON string (handles newlines, quotes, etc.)
        CMD=$(jq -Rs . /tmp/deploy.sh)

        # Send command to EC2 via SSM (no inbound port required)
        COMMAND_ID=$(aws ssm send-command \
          --instance-id "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 300 \
          --parameters "{\"commands\":[$CMD]}" \
          --output text --query "Command.CommandId")

        echo "SSM Command ID: $COMMAND_ID"

        # Poll for completion (up to 5 minutes)
        for i in $(seq 1 60); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "[$i/60] $STATUS"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut)
              echo "=== Error output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1 ;;
          esac
          sleep 5
        done

        # Print full output
        echo "=== Deploy output ==="
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" --output text

        [ "$STATUS" = "Success" ] || { echo "Timed out waiting for deploy"; exit 1; }
