name: Deploy to Ubuntu Server

# Manual / backup deploy path via AWS SSM (no inbound SSH / public IP needed).
# The automatic push-to-main deploy runs in ci.yml via EC2 Instance Connect;
# this one is workflow_dispatch-only to avoid racing two deploys per push.
on:
  workflow_dispatch:

# Setup state (account 188046727805, instance i-09af962714b13f9bc):
#   1. GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, EC2_INSTANCE_ID
#   2. IAM: role 'devops-agent-ssm-role' (AmazonSSMManagedInstanceCore) attached
#      to the instance via profile 'devops-agent-ssm-profile'. SSM agent Online.
#   3. Private-repo pull uses a read-only SSH deploy key on the box
#      (/home/ubuntu/.ssh/deploy_key, set via the repo's core.sshCommand) so no
#      token is ever passed through SSM command parameters / CloudTrail.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy via AWS SSM
      uses: nick-fields/retry@v3
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      with:
        max_attempts: 3
        retry_wait_seconds: 15
        timeout_minutes: 10
        command: |
          # Write the deploy script to a temp file
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          CODE=/var/www/devops-agent
          VENV=$CODE/venv

          echo "=== Pulling latest code ==="
          # Authenticate via the read-only SSH deploy key. Force the SSH remote +
          # key here every run because ci.yml's deploy rewrites origin back to
          # HTTPS (token-injected) on each push; this keeps deploy.yml self-
          # contained and avoids "could not read Username for https://github.com".
          # No token passes through SSM params / CloudTrail.
          sudo -u ubuntu git -C "$CODE" remote set-url origin git@github.com:shittuay/DevOps-Agent.git
          sudo -u ubuntu git -C "$CODE" config core.sshCommand "ssh -i /home/ubuntu/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          sudo -u ubuntu git -C "$CODE" fetch origin main
          sudo -u ubuntu git -C "$CODE" reset --hard origin/main
          echo "Deployed: $(sudo -u ubuntu git -C $CODE rev-parse --short HEAD)"

          echo "=== Installing dependencies ==="
          sudo -u ubuntu "$VENV/bin/pip" install -r "$CODE/requirements.txt" -q

          echo "=== Restarting service ==="
          systemctl restart devops-agent
          sleep 4
          systemctl is-active devops-agent

          echo "=== Health check ==="
          curl -sf http://localhost:8000/health && echo "HEALTH: OK" || { echo "HEALTH: FAIL"; exit 1; }
          echo "=== Deploy complete ==="
          SCRIPT

          # Encode script as JSON string (handles newlines, quotes, etc.)
          CMD=$(jq -Rs . /tmp/deploy.sh)

          # Send command to EC2 via SSM (no inbound port required)
          COMMAND_ID=$(aws ssm send-command \
            --instance-id "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters "{\"commands\":[$CMD]}" \
            --output text --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for completion (up to 5 minutes)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "=== Error output ==="
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
            sleep 5
          done

          # Print full output
          echo "=== Deploy output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          [ "$STATUS" = "Success" ] || { echo "Timed out waiting for deploy"; exit 1; }
