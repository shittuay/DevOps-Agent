name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        command_timeout: 10m
        script: |
          set -e

          echo "Starting DevOps Agent Deployment..."

          APP_DIR="/home/ubuntu/app"
          VENV_DIR="$APP_DIR/venv"

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          # Kill ALL existing processes on port 5000 and reset PM2
          echo "Stopping existing processes..."
          pm2 stop all 2>/dev/null || true
          pm2 delete all 2>/dev/null || true
          pm2 kill 2>/dev/null || true
          sudo fuser -k 5000/tcp 2>/dev/null || true
          sleep 2

          # Remove old code
          echo "Removing old code..."
          rm -rf DevOps-Agent

          # Clone fresh code
          echo "Cloning latest code..."
          git clone https://github.com/shittuay/DevOps-Agent.git
          cd DevOps-Agent

          # Ensure Node.js and PM2 are available
          echo "Checking PM2..."
          if ! command -v pm2 &> /dev/null; then
            echo "Installing Node.js and PM2..."
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g pm2
          fi

          # Set up virtual environment
          echo "Setting up Python virtual environment..."
          python3 -m venv "$VENV_DIR" 2>/dev/null || true
          source "$VENV_DIR/bin/activate"

          # Install Python dependencies
          echo "Installing dependencies..."
          pip install --upgrade pip
          pip install -r requirements.txt

          # Create necessary directories
          mkdir -p logs instance config

          # Write .env file (strip leading whitespace from YAML heredoc)
          echo "Configuring environment..."
          cat > config/.env << 'ENVEOF'
          FLASK_ENV=production
          USE_AWS_SECRETS=true
          AWS_DEFAULT_REGION=us-east-1
          BASE_URL=https://devopsagent.io
          PORT=5000
          HOST=0.0.0.0
          LOG_LEVEL=INFO
          ENVEOF
          sed -i 's/^[[:space:]]*//' config/.env

          # Create a launcher script that sets env vars and runs the app
          # PM2 ecosystem config doesn't work with Python interpreter (ProcessContainerForkBun.js conflict)
          cat > start.sh << 'SHEOF'
          #!/bin/bash
          export FLASK_ENV=production
          export USE_AWS_SECRETS=true
          export AWS_DEFAULT_REGION=us-east-1
          export BASE_URL=https://devopsagent.io
          export PORT=5000
          export HOST=0.0.0.0
          SHEOF
          sed -i 's/^[[:space:]]*//' start.sh
          echo "cd $APP_DIR/DevOps-Agent" >> start.sh
          echo "source $VENV_DIR/bin/activate" >> start.sh
          echo "exec python app.py" >> start.sh
          chmod +x start.sh

          # Initialize database
          echo "Initializing database..."
          FLASK_ENV=production USE_AWS_SECRETS=true AWS_DEFAULT_REGION=us-east-1 \
            python -c "from app import app, db; app.app_context().push(); db.create_all()" || echo "Database already initialized"

          # Clear old PM2 logs before starting
          pm2 flush 2>/dev/null || true

          echo "Starting application..."
          pm2 start start.sh --name devops-agent --interpreter bash

          # Save PM2 configuration
          pm2 save

          # Wait for app to stabilize
          sleep 5

          # Check status and show logs for debugging
          echo "=== PM2 Status ==="
          pm2 status devops-agent
          echo ""
          echo "=== Recent PM2 Logs ==="
          pm2 logs devops-agent --lines 30 --nostream || true

          echo ""
          echo "Deployment completed successfully!"
          echo "App accessible at: https://devopsagent.io"
