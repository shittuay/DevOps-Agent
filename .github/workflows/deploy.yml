name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        command_timeout: 10m
        script: |
          set -e

          echo "Starting DevOps Agent Deployment..."

          APP_DIR="/home/ubuntu/app"
          VENV_DIR="$APP_DIR/venv"

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          # Stop existing PM2 processes
          echo "Stopping existing processes..."
          pm2 stop devops-agent 2>/dev/null || true
          pm2 delete devops-agent 2>/dev/null || true

          # Remove old code
          echo "Removing old code..."
          rm -rf DevOps-Agent

          # Clone fresh code
          echo "Cloning latest code..."
          git clone https://github.com/shittuay/DevOps-Agent.git
          cd DevOps-Agent

          # Ensure Node.js and PM2 are available
          echo "Checking PM2..."
          if ! command -v pm2 &> /dev/null; then
            echo "Installing Node.js and PM2..."
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g pm2
          fi

          # Set up virtual environment
          echo "Setting up Python virtual environment..."
          python3 -m venv "$VENV_DIR" 2>/dev/null || true
          source "$VENV_DIR/bin/activate"

          # Install Python dependencies
          echo "Installing dependencies..."
          pip install --upgrade pip
          pip install -r requirements.txt

          # Create necessary directories
          mkdir -p logs instance config

          # Configure .env fallback (no leading spaces!)
          echo "Configuring environment..."
          cat > config/.env << 'ENVEOF'
          FLASK_ENV=production
          USE_AWS_SECRETS=true
          AWS_DEFAULT_REGION=us-east-1
          BASE_URL=https://devopsagent.io
          PORT=5000
          HOST=0.0.0.0
          LOG_LEVEL=INFO
          ENVEOF
          # Strip leading whitespace from .env (YAML heredoc adds indentation)
          sed -i 's/^[[:space:]]*//' config/.env

          # Initialize database (with env vars so init_secrets can run)
          echo "Initializing database..."
          FLASK_ENV=production USE_AWS_SECRETS=true AWS_DEFAULT_REGION=us-east-1 \
            python -c "from app import app, db; app.app_context().push(); db.create_all()" || echo "Database already initialized"

          # Create PM2 ecosystem config for persistent env vars
          # This ensures env vars survive PM2 restarts and reboots
          cat > ecosystem.config.js << JSEOF
          module.exports = {
            apps: [{
              name: 'devops-agent',
              script: 'app.py',
              interpreter: '$VENV_DIR/bin/python',
              cwd: '$APP_DIR/DevOps-Agent',
              env: {
                FLASK_ENV: 'production',
                USE_AWS_SECRETS: 'true',
                AWS_DEFAULT_REGION: 'us-east-1',
                BASE_URL: 'https://devopsagent.io',
                PORT: '5000',
                HOST: '0.0.0.0'
              },
              max_restarts: 5,
              restart_delay: 5000
            }]
          };
          JSEOF

          echo "Starting application with PM2 ecosystem config..."
          pm2 start ecosystem.config.js

          # Save PM2 configuration
          pm2 save

          # Wait for app to stabilize
          sleep 5

          # Check status and show logs for debugging
          echo "=== PM2 Status ==="
          pm2 status devops-agent
          echo ""
          echo "=== Recent PM2 Logs ==="
          pm2 logs devops-agent --lines 30 --nostream || true

          echo ""
          echo "Deployment completed successfully!"
          echo "App accessible at: https://devopsagent.io"
