version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 turns off routine version-update PRs, so this file changes nothing except that
    # security-update PRs (which are what has been opening the "pip group" bumps) now
    # honour the ignore list below.
    open-pull-requests-limit: 0
    ignore:
      # The production server's venv runs Python 3.10. These releases require Python >=3.11
      # and fail the deploy's pip install (2026-10-30 and 2026-11-15). Remove both entries,
      # and raise the server-python-check job's python-version in ci.yml, once the server
      # moves to Python 3.11+.
      - dependency-name: "Pillow"
        versions: [">=13"]
      - dependency-name: "dnspython"
        versions: [">=2.9"]
