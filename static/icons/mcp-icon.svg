<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark mode background -->
  <rect width="128" height="128" fill="#0a0a0a" rx="16"/>

  <!-- Grid pattern (terminal aesthetic) -->
  <g stroke="#1a1a2e" stroke-width="1">
    <line x1="0" y1="32" x2="128" y2="32"/>
    <line x1="0" y1="64" x2="128" y2="64"/>
    <line x1="0" y1="96" x2="128" y2="96"/>
    <line x1="32" y1="0" x2="32" y2="128"/>
    <line x1="64" y1="0" x2="64" y2="128"/>
    <line x1="96" y1="0" x2="96" y2="128"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.6"/>

  <!-- Main circle -->
  <circle cx="64" cy="64" r="38" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2"/>

  <!-- Terminal prompt symbol (>_) -->
  <g fill="#ff6b35">
    <!-- > -->
    <path d="M48 50 L60 64 L48 78 L52 78 L64 64 L52 50 Z"/>
    <!-- _ -->
    <rect x="68" y="74" width="20" height="4" rx="1"/>
  </g>

  <!-- Server/cloud nodes -->
  <g fill="#ff6b35" opacity="0.8">
    <!-- Top node -->
    <circle cx="64" cy="36" r="4"/>
    <!-- Left node -->
    <circle cx="40" cy="56" r="4"/>
    <!-- Right node -->
    <circle cx="88" cy="56" r="4"/>
    <!-- Bottom node -->
    <circle cx="64" cy="82" r="4"/>
  </g>

  <!-- Connection lines between nodes -->
  <g stroke="#ff6b35" stroke-width="1.5" opacity="0.5">
    <line x1="64" y1="40" x2="44" y2="54"/>
    <line x1="64" y1="40" x2="84" y2="54"/>
    <line x1="44" y1="58" x2="60" y2="80"/>
    <line x1="84" y1="58" x2="68" y2="80"/>
  </g>
</svg>
