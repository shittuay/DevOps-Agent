# SonarQube analysis configuration for DevOps Agent
# Run with: ./scripts/sonar-scan.sh   (see docs/sonarqube.md)

sonar.projectKey=devops-agent
sonar.projectName=DevOps Agent
sonar.sourceEncoding=UTF-8

# --- Sources -----------------------------------------------------------------
# Everything is scanned except the exclusions below, so new top-level packages
# are picked up automatically instead of silently going unanalysed.
sonar.sources=.
sonar.tests=tests

# --- Exclusions --------------------------------------------------------------
# cli/node_modules is 366 vendored third-party files committed to the repo;
# analysing it drowns first-party findings at roughly 20:1.
sonar.exclusions=\
  **/node_modules/**,\
  venv/**,\
  .venv/**,\
  env/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/static/vendor/**,\
  **/static/js/vendor/**,\
  migrations/versions/**,\
  cli/dist/**,\
  htmlcov/**,\
  logs/**,\
  docs/**,\
  vault/**,\
  **/*.egg-info/**,\
  scratch_*.py

# Test code is analysed under test rules, not production rules.
sonar.test.inclusions=tests/**/*.py

# Duplication between test modules is usually deliberate (fixtures, arrange
# blocks) and is not worth refactoring.
sonar.cpd.exclusions=tests/**,migrations/**

# --- Language settings -------------------------------------------------------
# Matches PYTHON_VERSION in .github/workflows/ci.yml.
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
